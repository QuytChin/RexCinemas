spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB
spring.sql.init.mode=never
app.seed.enabled=false
app.cookie.secure=true
app.mail.tickets.enabled=${TICKET_EMAIL_ENABLED:true}

# Production must use an explicit migration process; the application validates only.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.endpoints.jmx.exposure.exclude=*
