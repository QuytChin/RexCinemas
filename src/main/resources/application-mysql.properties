spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rex_chain_cinema?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

# Hibernate validates the release schema and never changes a shared database.
# For a new installation, import database/mysql/schema.sql and initial-data.sql first.
# Never enable Spring's automatic SQL initializer for a shared database.
