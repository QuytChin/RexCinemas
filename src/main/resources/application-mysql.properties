spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rex_chain_cinema?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

# MySQL schema changes are reviewed, backed up and run as an explicit migration.
# Never enable Spring's automatic SQL initializer for a shared database.

# MySQL migrations under classpath:db are intentionally one-time scripts; run them after a backup.
