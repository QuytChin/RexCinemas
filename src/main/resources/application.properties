spring.application.name=rex-chain-cinema
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.sql.init.encoding=UTF-8
# Only the minimal liveness/readiness health endpoint is exposed over HTTP.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES:false}
management.endpoints.jmx.exposure.exclude=*

# Required in every environment: at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.remember-expiration-ms=${JWT_REMEMBER_EXPIRATION_MS:2592000000}
app.cookie.secure=${COOKIE_SECURE:true}

# OTP abuse protection; override per environment when policy changes.
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-failed-attempts=${OTP_MAX_FAILED_ATTEMPTS:5}
app.otp.lockout-minutes=${OTP_LOCKOUT_MINUTES:1}
app.otp.email-cooldown-seconds=${OTP_EMAIL_COOLDOWN_SECONDS:60}
app.otp.ip-cooldown-seconds=${OTP_IP_COOLDOWN_SECONDS:20}
app.otp.email-hourly-limit=${OTP_EMAIL_HOURLY_LIMIT:5}
app.otp.ip-hourly-limit=${OTP_IP_HOURLY_LIMIT:20}
app.otp.ip-verification-hourly-limit=${OTP_IP_VERIFICATION_HOURLY_LIMIT:60}
app.otp.cleanup-interval-ms=${OTP_CLEANUP_INTERVAL_MS:300000}
app.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:10}
app.upload.image.max-bytes=${UPLOAD_IMAGE_MAX_BYTES:5242880}
app.upload.image.max-pixels=${UPLOAD_IMAGE_MAX_PIXELS:25000000}
app.upload.image.max-width=${UPLOAD_IMAGE_MAX_WIDTH:10000}
app.upload.image.max-height=${UPLOAD_IMAGE_MAX_HEIGHT:10000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Payment sandbox (optional)
payment.base-url=${PAYMENT_BASE_URL:http://localhost:8080}
# SePay VietQR production foundation (disabled until all values are provided).
sepay.enabled=${SEPAY_ENABLED:false}
sepay.api-key=${SEPAY_API_KEY:}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.bank-name=${SEPAY_BANK_NAME:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
sepay.webhook-auth-mode=${SEPAY_WEBHOOK_AUTH_MODE:API_KEY}
sepay.webhook-timestamp-tolerance-seconds=${SEPAY_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:REX}

# Demo accounts are opt-in. Set ADMIN_INITIAL_PASSWORD to bootstrap an empty database.
app.seed.admin-email=${ADMIN_INITIAL_EMAIL:admin@rexchain.vn}
app.seed.admin-password=${ADMIN_INITIAL_PASSWORD:}
app.seed.demo-users=${SEED_DEMO_USERS:false}
app.seed.demo-customer-password=${DEMO_CUSTOMER_PASSWORD:}

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# xAI Grok API - Trợ lý AI tư vấn phim & hỗ trợ khách hàng
app.grok.enabled=${GROK_ENABLED:true}
app.grok.api-key=${GROK_API_KEY:}
app.grok.api-url=${GROK_API_URL:https://api.x.ai/v1/chat/completions}
app.grok.model=${GROK_MODEL:grok-2-latest}
app.grok.timeout-seconds=${GROK_TIMEOUT_SECONDS:15}
app.grok.temperature=${GROK_TEMPERATURE:0.7}
app.grok.max-tokens=${GROK_MAX_TOKENS:800}
