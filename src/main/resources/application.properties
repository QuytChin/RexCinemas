spring.application.name=rex-chain-cinema
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.sql.init.encoding=UTF-8
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.clean-disabled=true

# Required in every environment: at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:rexchaincinemasecretkey2026forjwttokengenerationatleast32byteslong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.remember-expiration-ms=${JWT_REMEMBER_EXPIRATION_MS:2592000000}
app.cookie.secure=${COOKIE_SECURE:false}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Payment sandbox (optional)
payment.base-url=${PAYMENT_BASE_URL:http://localhost:8080}
# SePay VietQR production foundation (disabled until all values are provided).
sepay.enabled=${SEPAY_ENABLED:false}
sepay.api-key=${SEPAY_API_KEY:}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
sepay.webhook-auth-mode=${SEPAY_WEBHOOK_AUTH_MODE:API_KEY}
sepay.webhook-timestamp-tolerance-seconds=${SEPAY_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:REX}

# Demo accounts are opt-in. Set ADMIN_INITIAL_PASSWORD to bootstrap an empty database.
app.seed.admin-email=${ADMIN_INITIAL_EMAIL:admin@rexchain.vn}
app.seed.admin-password=${ADMIN_INITIAL_PASSWORD:}
app.seed.demo-users=${SEED_DEMO_USERS:false}
app.seed.demo-customer-password=${DEMO_CUSTOMER_PASSWORD:}
app.seed.demo-manager-password=${DEMO_MANAGER_PASSWORD:}

