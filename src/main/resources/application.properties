spring.application.name=rex-chain-cinema
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
app.jwt.secret=${JWT_SECRET:rex-chain-cinema-demo-secret-key-must-be-at-least-32-bytes-long-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Payment sandbox (optional)
payment.base-url=${PAYMENT_BASE_URL:http://localhost:8080}
payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}

app.cookie.secure=${COOKIE_SECURE:false}
