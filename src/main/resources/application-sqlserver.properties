spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=rex_chain_cinema;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Run repeatable integrity scripts after Hibernate has created/updated a fresh schema.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/sqlserver-v4-to-v5.sql,classpath:db/sqlserver-v5-to-v6-registration.sql,classpath:db/sqlserver-v6-to-v7-integrity.sql
spring.sql.init.continue-on-error=false
