spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=rex_chain_cinema;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:huy210906}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration/sqlserver
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=10
spring.flyway.validate-on-migrate=true

# Run repeatable integrity scripts after Hibernate has created/updated a fresh schema.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/sqlserver-v4-to-v5.sql,classpath:db/sqlserver-v5-to-v6-registration.sql,classpath:db/sqlserver-v6-to-v7-integrity.sql,classpath:db/sqlserver-v7-unicode.sql,classpath:db/sqlserver-v8-unicode.sql,classpath:db/sqlserver-v9-demo-images.sql,classpath:db/sqlserver-v10-user-login-identifiers.sql
spring.sql.init.continue-on-error=true
