spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=rex_chain_cinema;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration/sqlserver
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=10
spring.flyway.validate-on-migrate=true

# Schema changes are controlled by Flyway when FLYWAY_ENABLED=true.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
