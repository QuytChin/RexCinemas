spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=rex_chain_cinema;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:chien722006}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Upgrade an existing V4 SQL Server schema before Hibernate validates/updates entities.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/sqlserver-v4-to-v5.sql
spring.sql.init.continue-on-error=false
