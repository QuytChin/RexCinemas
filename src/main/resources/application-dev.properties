# Never let the development profile mutate a shared schema implicitly.  Schema
# apply reviewed schema changes after a backup.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
app.cookie.secure=${COOKIE_SECURE:false}
app.seed.enabled=${SEED_ENABLED:false}

# Do not log request bodies in the local development profile; registration
# requests contain passwords and one-time passwords.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
