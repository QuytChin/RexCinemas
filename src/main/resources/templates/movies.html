<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danh sách phim - Rex Cinemas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-xl pt-page pb-5">
<section class="catalog-head"><p class="eyebrow">MOVIES</p><h1>Khám phá phim tại Rex Cinemas</h1><form th:action="@{/movies}" method="get" class="catalog-search"><input class="form-control" name="q" th:value="${q}" placeholder="Tên phim hoặc thể loại"><select class="form-select" name="status"><option value="all" th:selected="${status=='all'}">Tất cả</option><option value="now" th:selected="${status=='now'}">Đang chiếu</option><option value="coming" th:selected="${status=='coming'}">Sắp chiếu</option></select><button class="btn btn-rex">Tìm phim</button></form></section>
<div class="movie-grid mt-4"><article class="rex-movie-card" th:each="m:${movies}"><a class="poster-link" th:href="@{'/movies/'+${m.id}}"><img th:src="${m.posterUrl}" th:alt="${m.title}"><span class="age-tag" th:text="${m.ageRating}"></span><span class="poster-hover">XEM CHI TIẾT</span></a><div class="movie-card-body"><h3 th:text="${m.title}"></h3><p th:text="${m.genre}"></p><div><span th:text="${m.releaseDate!=null?#temporals.format(m.releaseDate,'dd/MM/yyyy'):''}"></span><a th:href="@{'/movies/'+${m.id}}">XEM PHIM</a></div></div></article></div>
<div class="empty-panel mt-4" th:if="${movies.isEmpty()}">Không tìm thấy phim phù hợp.</div>
</main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
