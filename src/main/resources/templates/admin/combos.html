<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Combo bắp nước</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="admin-title">
        <div><p class="eyebrow">FOOD & DRINK</p><h1>Combo bắp nước</h1></div>
        <div th:replace="~{fragments/admin-nav :: adminNav}"></div>
    </div>
    <div th:replace="~{fragments/admin-list :: filters}"></div>
    <div class="row g-4">
        <div class="col-lg-4">
            <form th:action="@{/admin/combos/save}" method="post" enctype="multipart/form-data" class="admin-form">
                <input type="hidden" name="id" th:value="${editCombo.id}">
                <h4 th:text="${editCombo.id!=null?'Sửa combo':'Thêm combo'}"></h4>
                <label>Tên combo</label>
                <input name="name" maxlength="120" class="form-control" th:value="${editCombo.name}" required>
                <label>Mô tả</label>
                <textarea name="description" class="form-control" rows="3" th:text="${editCombo.description}"></textarea>
                <label>Giá bán</label>
                <input name="price" type="number" min="1000" step="1000" class="form-control" th:value="${editCombo.price}" required>
                <label>Tồn kho</label>
                <input name="stockQuantity" type="number" min="0" max="1000000" class="form-control"
                       th:value="${editCombo.id!=null?editCombo.stockQuantity:100}" required>
                <label>Ảnh combo (URL)</label>
                <input name="imageUrl" class="form-control" th:value="${editCombo.imageUrl}">
                <label>Hoặc tải ảnh lên</label>
                <input name="imageFile" type="file" accept="image/*" class="form-control">
                <button class="btn btn-rex w-100" th:text="${editCombo.id!=null?'Lưu thay đổi':'Thêm combo'}"></button>
                <a th:if="${editCombo.id!=null}" th:href="@{/admin/combos}" class="btn btn-link text-light w-100 mt-2">Hủy sửa</a>
            </form>
        </div>
        <div class="col-lg-8">
            <div class="row g-3">
                <div class="col-md-6" th:each="c:${combos}">
                    <div class="combo-admin-card">
                        <div class="combo-thumb">
                            <img th:src="${@cinemaArtwork.imageUrl(c.imageUrl, 'combo')}" data-image-fallback="combo" th:alt="${c.name}">

                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between">
                                <h5 th:text="${c.name}"></h5>
                                <span class="badge" th:classappend="${c.active?' text-bg-success':' text-bg-secondary'}"
                                      th:text="${c.active?'Đang bán':'Đã ẩn'}"></span>
                            </div>
                            <p class="text-secondary small" th:text="${c.description}"></p>
                            <strong th:text="${#numbers.formatDecimal(c.price,0,'COMMA',0,'POINT')+'đ'}"></strong>
                            <div class="small text-secondary mt-1" th:text="${'Tồn kho: '+c.stockQuantity}"></div>
                            <div class="d-flex gap-2 mt-3">
                                <a class="btn btn-sm btn-outline-light" th:href="@{/admin/combos(edit=${c.id})}">Sửa</a>
                                <form th:action="@{'/admin/combos/'+${c.id}+'/toggle'}" method="post">
                                    <button class="btn btn-sm btn-outline-light" th:text="${c.active?'Ẩn combo':'Bật lại'}"></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<div th:replace="~{fragments/admin-list :: pager}"></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
