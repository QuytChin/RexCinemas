<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Combo bắp nước</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">FOOD & DRINK</p><h1>Combo bắp nước</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div class="row g-4"><div class="col-lg-4"><form th:action="@{/admin/combos/save}" method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" name="id" th:value="${editCombo.id}"><h4 th:text="${editCombo.id!=null?'Sửa combo':'Thêm combo'}"></h4><label>Tên combo</label><input name="name" class="form-control mb-3" th:value="${editCombo.name}" required><label>Mô tả</label><textarea name="description" class="form-control mb-3" rows="3" th:text="${editCombo.description}"></textarea><label>Giá</label><input name="price" type="number" min="0" step="1000" class="form-control mb-3" th:value="${editCombo.price}" required><label>URL ảnh</label><input name="imageUrl" class="form-control mb-3" th:value="${editCombo.imageUrl}"><label>Hoặc upload Cloudinary</label><input name="imageFile" type="file" accept="image/*" class="form-control mb-3"><button class="btn btn-danger w-100" th:text="${editCombo.id!=null?'Lưu thay đổi':'Thêm combo'}"></button><a th:if="${editCombo.id!=null}" th:href="@{/admin/combos}" class="btn btn-link text-light w-100 mt-2">Hủy sửa</a></form></div><div class="col-lg-8"><div class="row g-3"><div class="col-md-6" th:each="c:${combos}"><div class="combo-admin-card"><div class="combo-thumb"><img th:if="${c.imageUrl!=null and !#strings.isEmpty(c.imageUrl)}" th:src="${c.imageUrl}"><span th:unless="${c.imageUrl!=null and !#strings.isEmpty(c.imageUrl)}">🍿</span></div><div class="flex-grow-1"><div class="d-flex justify-content-between"><h5 th:text="${c.name}"></h5><span class="badge" th:classappend="${c.active?' text-bg-success':' text-bg-secondary'}" th:text="${c.active?'Đang bán':'Đã ẩn'}"></span></div><p class="text-secondary small" th:text="${c.description}"></p><strong th:text="${#numbers.formatDecimal(c.price,0,'COMMA',0,'POINT')+'đ'}"></strong><div class="d-flex gap-2 mt-3"><a class="btn btn-sm btn-outline-light" th:href="@{/admin/combos(edit=${c.id})}">Sửa</a><form th:action="@{'/admin/combos/'+${c.id}+'/toggle'}" method="post"><button class="btn btn-sm btn-outline-light" th:text="${c.active?'Ẩn combo':'Bật lại'}"></button></form></div></div></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
