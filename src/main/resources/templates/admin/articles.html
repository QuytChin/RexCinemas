<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài viết</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-fluid admin-page-wrap pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">EDITORIAL</p><h1>Bài viết</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div class="row g-4"><div class="col-xl-5"><form class="admin-form" th:action="@{/admin/articles/save}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" th:value="${editArticle.id}"><h4 th:text="${editArticle.id==null?'Thêm bài viết':'Sửa bài viết'}"></h4><div class="row g-3"><div class="col-md-7"><label>Tiêu đề *</label><input class="form-control" name="title" th:value="${editArticle.title}" required></div><div class="col-md-5"><label>Chuyên mục</label><input class="form-control" name="category" th:value="${editArticle.category}" placeholder="TIN TỨC"></div><div class="col-12"><label>Tóm tắt</label><textarea class="form-control" rows="3" name="summary" th:text="${editArticle.summary}"></textarea></div><div class="col-12"><label>Nội dung</label><textarea class="form-control" rows="7" name="content" th:text="${editArticle.content}"></textarea></div><div class="col-md-6"><label>Ảnh URL</label><input class="form-control" name="imageUrl" th:value="${editArticle.imageUrl}"></div><div class="col-md-6"><label>Upload Cloudinary</label><input class="form-control" type="file" name="imageFile" accept="image/*"></div><div class="col-md-5"><label>Ngày đăng</label><input class="form-control" type="date" name="publishDate" th:value="${editArticle.publishDate}"></div><div class="col-md-3"><label>Thứ tự</label><input class="form-control" type="number" name="sortOrder" th:value="${editArticle.sortOrder}"></div><div class="col-md-4"><label>Link ngoài</label><input class="form-control" name="linkUrl" th:value="${editArticle.linkUrl}"></div><div class="col-12"><button class="btn btn-rex w-100">LƯU BÀI VIẾT</button></div></div></form></div><div class="col-xl-7"><div class="table-responsive"><table class="table table-dark align-middle"><thead><tr><th>Ảnh</th><th>Bài viết</th><th>Ngày</th><th>Hiển thị</th><th></th></tr></thead><tbody><tr th:each="a:${articles}"><td><img class="admin-thumb" th:if="${a.imageUrl!=null}" th:src="${a.imageUrl}" alt=""></td><td><span class="small text-warning" th:text="${a.category}"></span><br><strong th:text="${a.title}"></strong><div class="small text-secondary" th:text="${a.summary}"></div></td><td th:text="${a.publishDate!=null?#temporals.format(a.publishDate,'dd/MM/yyyy'):'—'}"></td><td><span class="badge" th:classappend="${a.active?' text-bg-success':' text-bg-secondary'}" th:text="${a.active?'Có':'Ẩn'}"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-light" th:href="@{/admin/articles(edit=${a.id})}">Sửa</a><form th:action="@{'/admin/articles/'+${a.id}+'/toggle'}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${a.active?'Ẩn':'Hiện'}"></button></form><form th:action="@{'/admin/articles/'+${a.id}+'/delete'}" method="post" onsubmit="return confirm('Xóa bài viết?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr></tbody></table></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
