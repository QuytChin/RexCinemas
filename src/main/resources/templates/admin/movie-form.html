<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form phim - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div>
    <header class="ui-page-header"><div><p class="eyebrow">MOVIE MANAGEMENT</p><h1 th:text="${movie.id == null ? 'Thêm phim mới' : 'Cập nhật phim'}"></h1></div><a class="btn btn-outline-light" th:href="@{/admin/movies}">Quay lại</a></header>
    <div class="alert alert-danger mt-3" role="alert" th:if="${error}" th:text="${error}"></div>
    <form class="admin-form mt-4" th:action="@{/admin/movies/save}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${movie.id}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Tên phim</label>
                <input class="form-control" name="title" th:value="${movie.title}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Thời lượng (phút)</label>
                <input class="form-control" type="number" name="durationMinutes" min="1" max="600" th:value="${movie.durationMinutes}" required>
            </div>
            <div class="col-12">
                <label class="form-label">Mô tả phim</label>
                <textarea class="form-control" rows="4" name="description" required th:text="${movie.description}"></textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label">Thể loại</label>
                <input class="form-control" name="genre" th:value="${movie.genre}" placeholder="Hành động, Viễn tưởng...">
            </div>
            <div class="col-md-4">
                <label class="form-label">Độ tuổi</label>
                <select class="form-select" name="ageRating">
                    <option th:each="r : ${ageRatings}"
                            th:value="${r.name()}"
                            th:text="${r.description}"
                            th:selected="${movie.ageRating != null and (movie.ageRating.name() == r.name() or movie.ageRating.code == r.code)}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Trạng thái chiếu</label>
                <select class="form-select" name="status">
                    <option th:each="s : ${movieStatuses}"
                            th:value="${s.name()}"
                            th:text="${s.displayName}"
                            th:selected="${movie.status != null and movie.status.name() == s.name()}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Ngôn ngữ</label>
                <input class="form-control" name="language" th:value="${movie.language}" placeholder="Tiếng Việt, Phụ đề...">
            </div>
            <div class="col-md-4">
                <label class="form-label">Ngày khởi chiếu</label>
                <input class="form-control" type="date" name="releaseDate" th:value="${movie.releaseDate}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Địa chỉ trailer (URL)</label>
                <input class="form-control" name="trailerUrl" th:value="${movie.trailerUrl}" placeholder="https://youtube.com/...">
            </div>
            <div class="col-md-6">
                <label class="form-label">Ảnh poster (URL)</label>
                <input class="form-control" name="posterUrl" th:value="${movie.posterUrl}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Hoặc upload ảnh Poster</label>
                <input class="form-control" type="file" name="posterFile" accept="image/*">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-rex px-4">Lưu phim</button>
            <a class="btn btn-outline-light" th:href="@{/admin/movies}">Quay lại</a>
        </div>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
