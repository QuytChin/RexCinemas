<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Form phim</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page pb-5"><div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div><h1 th:text="${movie.id==null?'Thêm phim':'Cập nhật phim'}"></h1><form class="admin-form mt-4" th:action="@{/admin/movies/save}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" th:value="${movie.id}"><div class="row g-3"><div class="col-md-8"><label>Tên phim</label><input class="form-control" name="title" th:value="${movie.title}" required></div><div class="col-md-4"><label>Thời lượng (phút)</label><input class="form-control" type="number" name="durationMinutes" th:value="${movie.durationMinutes}" required></div><div class="col-12"><label>Mô tả</label><textarea class="form-control" rows="5" name="description" required th:text="${movie.description}"></textarea></div><div class="col-md-4"><label>Thể loại</label><input class="form-control" name="genre" th:value="${movie.genre}"></div><div class="col-md-4"><label>Phân loại</label><input class="form-control" name="ageRating" th:value="${movie.ageRating}"></div><div class="col-md-4"><label>Ngôn ngữ</label><input class="form-control" name="language" th:value="${movie.language}"></div><div class="col-md-4"><label>Ngày phát hành</label><input class="form-control" type="date" name="releaseDate" th:value="${movie.releaseDate}"></div><div class="col-md-8"><label>Trailer URL</label><input class="form-control" name="trailerUrl" th:value="${movie.trailerUrl}"></div><div class="col-md-6"><label>Poster URL</label><input class="form-control" name="posterUrl" th:value="${movie.posterUrl}"></div><div class="col-md-6"><label>Hoặc upload Cloudinary</label><input class="form-control" type="file" name="posterFile" accept="image/*"></div></div><button class="btn btn-danger mt-4">Lưu phim</button></form></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
