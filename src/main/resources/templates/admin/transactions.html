<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giao dịch thanh toán | RexCinemas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div>
    <header class="ui-page-header"><div><p class="eyebrow">PAYMENT TRANSACTIONS</p><h1>Đối soát giao dịch</h1></div></header>
    <form class="ui-card payment-transaction-filters" method="get" th:action="@{/admin/transactions}"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label">Trạng thái<select class="form-select" name="status"><option value="">Tất cả</option><option th:each="s : ${transactionStatuses}" th:value="${s}" th:text="${@uiText.label(s)}" th:selected="${s == filterStatus}"></option></select></label></div><div class="col-md-2"><label class="form-label">Từ ngày<input class="form-control" type="date" name="from" th:value="${filterFrom}"></label></div><div class="col-md-2"><label class="form-label">Đến ngày<input class="form-control" type="date" name="to" th:value="${filterTo}"></label></div><div class="col-md-3"><label class="form-label">Mã đặt vé / giao dịch<input class="form-control" name="q" th:value="${filterQuery}" placeholder="Mã REX... hoặc mã giao dịch"></label></div><div class="col-md-2"><label class="form-label">Sắp xếp<select class="form-select" name="sort"><option th:each="value:${adminSorts}" th:value="${value}" th:text="${@uiText.label(value)}" th:selected="${value==adminSort}"></option></select></label></div><div class="col-md-1"><label class="form-label">Chiều<select class="form-select" name="dir"><option value="desc" th:selected="${adminDir=='desc'}">Giảm</option><option value="asc" th:selected="${adminDir=='asc'}">Tăng</option></select></label></div><div class="col-md-1"><label class="form-label">Mỗi trang<select class="form-select" name="size"><option value="10" th:selected="${adminPage.size==10}">10</option><option value="20" th:selected="${adminPage.size==20}">20</option><option value="50" th:selected="${adminPage.size==50}">50</option><option value="100" th:selected="${adminPage.size==100}">100</option></select></label></div><div class="col-md-2 d-flex gap-2"><button class="btn btn-rex flex-fill" type="submit"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#filter"></use></svg><span>Lọc</span></button><a class="btn btn-outline-light" th:href="@{/admin/transactions}">Xóa</a></div></div></form>
    <div class="alert alert-info" th:if="${!transactionsSchemaAvailable}">Chưa cài đặt cấu trúc dữ liệu giao dịch. Hãy import <code>database/mysql/schema.sql</code> trước khi sử dụng trang đối soát.</div>
    <section class="ui-card payment-transactions"><div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Mã giao dịch</th><th>Mã đặt vé</th><th>Số tiền</th><th>Tài khoản nhận</th><th>Trạng thái</th><th>Nhận lúc</th><th></th></tr></thead><tbody><tr th:each="tx : ${transactions}"><td><strong th:text="${tx.providerTransactionId}"></strong><div class="small text-secondary" th:text="${tx.gateway ?: '—'}"></div></td><td><span th:text="${tx.bookingCode ?: 'Chưa khớp'}"></span><div class="small text-secondary" th:text="${tx.paymentReference ?: '—'}"></div></td><td th:text="${tx.amount == null ? '—' : #numbers.formatDecimal(tx.amount,0,'COMMA',0,'POINT') + 'đ'}"></td><td th:text="${tx.accountNumberLast4 == null ? '—' : '•••• ' + tx.accountNumberLast4}"></td><td><span class="ui-badge" th:classappend="${tx.status == 'SETTLED' ? ' ui-badge--success' : (tx.status == 'NEEDS_REVIEW' ? ' ui-badge--danger' : ' ui-badge--muted')}" th:text="${@uiText.label(tx.status)}"></span><div class="small text-warning" th:if="${tx.reason != null}" th:text="${@uiText.label(tx.reason)}"></div></td><td th:text="${tx.receivedAt == null ? '—' : #temporals.format(tx.receivedAt,'dd/MM/yyyy HH:mm:ss')}"></td><td><a class="btn btn-sm btn-outline-light" th:href="@{'/admin/transactions/' + ${tx.id}}">Chi tiết</a></td></tr><tr th:if="${#lists.isEmpty(transactions)}"><td colspan="7" class="text-center text-secondary py-4">Chưa có giao dịch phù hợp.</td></tr></tbody></table></div></section>
<div th:replace="~{fragments/admin-list :: pager}"></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
