<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý phim - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div>
    <header class="ui-page-header">
        <div><p class="eyebrow">MOVIE MANAGEMENT</p><h1>Quản lý phim</h1></div>
    </header>
    <div th:replace="~{fragments/admin-list :: filters}"></div>
    <div class="admin-movies-actions"><a class="btn btn-rex ui-btn ui-btn--primary" th:href="@{/admin/movies/new}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#plus"></use></svg><span>Thêm phim</span></a></div>
    <div class="table-responsive mt-4">
        <table class="table table-dark table-hover align-middle">
            <thead>
            <tr>
                <th>Mã</th>
                <th>Phim</th>
                <th>Phân loại</th>
                <th>Thể loại</th>
                <th>Thời lượng</th>
                <th>Trạng thái chiếu</th>
                <th>Hiển thị</th>
                <th class="text-end">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${movies}">
                <td th:text="${m.id}"></td>
                <td>
                    <strong th:text="${m.title}"></strong>
                    <div class="small text-secondary" th:if="${m.releaseDate != null}" th:text="'Khởi chiếu: ' + ${#temporals.format(m.releaseDate, 'dd/MM/yyyy')}"></div>
                </td>
                <td>
                    <span class="badge bg-secondary text-uppercase fw-bold" th:text="${m.ageRating != null ? m.ageRating.code : 'P'}"></span>
                </td>
                <td th:text="${m.genre}"></td>
                <td th:text="${m.durationMinutes + ' phút'}"></td>
                <td>
                    <span th:if="${m.status != null and m.status.name() == 'NOW_SHOWING'}" class="badge bg-success">Đang chiếu</span>
                    <span th:if="${m.status != null and m.status.name() == 'COMING_SOON'}" class="badge bg-warning text-dark">Sắp chiếu</span>
                    <span th:if="${m.status != null and m.status.name() == 'ENDED'}" class="badge bg-secondary">Đã kết thúc</span>
                    <span th:if="${m.status == null}" class="badge bg-info text-dark">Đang chiếu</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${m.active ? 'bg-primary' : 'bg-dark text-muted'}" th:text="${m.active ? 'Đang bật' : 'Đã ẩn'}"></span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-light me-1" th:href="@{'/admin/movies/' + ${m.id} + '/edit'}">Sửa</a>
                    <form class="d-inline" th:action="@{'/admin/movies/' + ${m.id} + '/toggle'}" method="post">
                        <button class="btn btn-sm" th:classappend="${m.active ? 'btn-outline-danger' : 'btn-outline-success'}" th:text="${m.active ? 'Ẩn' : 'Bật lại'}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
<div th:replace="~{fragments/admin-list :: pager}"></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
