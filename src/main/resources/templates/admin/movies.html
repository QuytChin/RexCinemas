<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quản lý phim</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page"><div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div><div class="d-flex justify-content-between"><h1>Quản lý phim</h1><a class="btn btn-danger" th:href="@{/admin/movies/new}">+ Thêm phim</a></div><div class="table-responsive mt-4"><table class="table table-dark table-hover align-middle"><thead><tr><th>ID</th><th>Phim</th><th>Thể loại</th><th>Thời lượng</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="m:${movies}"><td th:text="${m.id}"></td><td><strong th:text="${m.title}"></strong></td><td th:text="${m.genre}"></td><td th:text="${m.durationMinutes+' phút'}"></td><td th:text="${m.active?'Đang bật':'Đã ẩn'}"></td><td class="text-end"><a class="btn btn-sm btn-outline-light" th:href="@{'/admin/movies/'+${m.id}+'/edit'}">Sửa</a><form class="d-inline" th:action="@{'/admin/movies/'+${m.id}+'/toggle'}" method="post"><button class="btn btn-sm" th:classappend="${m.active ? ' btn-outline-danger' : ' btn-outline-success'}" th:text="${m.active ? 'Ẩn' : 'Bật lại'}"></button></form></td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
