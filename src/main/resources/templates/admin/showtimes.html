<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suất chiếu</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="admin-title"><div><p class="eyebrow">PROGRAMMING</p><h1>Suất chiếu</h1><p class="text-secondary mb-0">Tạo lịch chiếu sẽ tự sinh sơ đồ ghế và mở chức năng đặt vé cho khách.</p></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div>
    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
    <form class="admin-form mt-4" th:action="@{/admin/showtimes/save}" method="post"><input type="hidden" name="id" th:value="${editShowtime.id}"><div class="row g-3 align-items-end">
        <div class="col-md-3"><label>Phim</label><select class="form-select" name="movieId" th:disabled="${editShowtime.id!=null}"><option th:each="m:${movies}" th:value="${m.id}" th:text="${m.title}" th:selected="${editShowtime.movie!=null and editShowtime.movie.id==m.id}"></option></select><input th:if="${editShowtime.id!=null}" type="hidden" name="movieId" th:value="${editShowtime.movie.id}"></div>
        <div class="col-md-3"><label>Phòng</label><select class="form-select" name="auditoriumId" th:disabled="${editShowtime.id!=null}"><option th:each="a:${auditoriums}" th:value="${a.id}" th:text="${a.cinema.name+' - '+a.name}" th:selected="${editShowtime.auditorium!=null and editShowtime.auditorium.id==a.id}"></option></select><input th:if="${editShowtime.id!=null}" type="hidden" name="auditoriumId" th:value="${editShowtime.auditorium.id}"></div>
        <div class="col-md-2"><label>Bắt đầu</label><input class="form-control" type="datetime-local" name="startTime" required th:value="${editShowtime.startTime!=null?#temporals.format(editShowtime.startTime,'yyyy-MM-dd''T''HH:mm'):''}"></div>
        <div class="col-md-2"><label>Giá chuẩn</label><input class="form-control" type="number" name="basePrice" min="1000" step="1000" th:value="${editShowtime.basePrice!=null?editShowtime.basePrice:75000}" required></div>
        <div class="col-md-2"><button class="btn btn-rex w-100" th:text="${editShowtime.id==null?'Tạo suất & mở bán':'Lưu thay đổi'}"></button></div>
    </div><div class="small text-secondary mt-3">Hệ thống tự chặn trùng lịch trong cùng phòng theo thời lượng phim + 15 phút dọn phòng.</div></form>
    <div class="table-responsive mt-4"><table class="table table-dark table-hover align-middle"><thead><tr><th>Phim</th><th>Rạp/Phòng</th><th>Giờ</th><th>Giá</th><th>Bán vé</th><th></th></tr></thead><tbody><tr th:each="s:${showtimes}"><td th:text="${s.movie.title}"></td><td th:text="${s.auditorium.cinema.name+' / '+s.auditorium.name}"></td><td th:text="${#temporals.format(s.startTime,'HH:mm dd/MM/yyyy')}"></td><td th:text="${#numbers.formatDecimal(s.basePrice,0,'COMMA',0,'POINT')+'đ'}"></td><td><span class="badge" th:classappend="${s.active and s.startTime.isAfter(now)?' text-bg-success':' text-bg-secondary'}" th:text="${s.active and s.startTime.isAfter(now)?'Đang mở đặt':'Đã đóng'}"></span><div><a class="small" th:if="${s.active and s.startTime.isAfter(now)}" th:href="@{'/booking/'+${s.id}}" target="_blank">Mở trang đặt vé ↗</a></div></td><td class="d-flex gap-2"><a class="btn btn-sm btn-outline-light" th:href="@{/admin/showtimes(edit=${s.id})}">Sửa</a><form th:action="@{'/admin/showtimes/'+${s.id}+'/toggle'}" method="post"><button class="btn btn-sm" th:classappend="${s.active ? ' btn-outline-danger' : ' btn-outline-success'}" th:text="${s.active ? 'Ẩn' : 'Bật lại'}"></button></form></td></tr></tbody></table></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
