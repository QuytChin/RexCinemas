<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Voucher</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">PROMOTION</p><h1>Voucher</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div class="row g-4"><div class="col-lg-4"><form th:action="@{/admin/vouchers/save}" method="post" class="admin-form"><input type="hidden" name="id" th:value="${editVoucher.id}"><h4 th:text="${editVoucher.id!=null?'Sửa voucher':'Tạo voucher'}"></h4><div class="row g-3"><div class="col-6"><label>Mã</label><input name="code" class="form-control text-uppercase" th:value="${editVoucher.code}" required></div><div class="col-6"><label>Tên</label><input name="name" class="form-control" th:value="${editVoucher.name}" required></div><div class="col-6"><label>Loại giảm</label><select name="discountType" class="form-select"><option th:each="d:${discountTypes}" th:value="${d}" th:text="${d}" th:selected="${d==editVoucher.discountType}"></option></select></div><div class="col-6"><label>Giá trị</label><input name="discountValue" type="number" step="1" min="0" class="form-control" th:value="${editVoucher.discountValue}" required></div><div class="col-6"><label>Đơn tối thiểu</label><input name="minOrderAmount" type="number" step="1000" min="0" class="form-control" th:value="${editVoucher.minOrderAmount}"></div><div class="col-6"><label>Giảm tối đa</label><input name="maxDiscountAmount" type="number" step="1000" min="0" class="form-control" th:value="${editVoucher.maxDiscountAmount}"></div><div class="col-6"><label>Bắt đầu</label><input name="validFrom" type="datetime-local" class="form-control" th:value="${editVoucher.validFrom!=null?#temporals.format(editVoucher.validFrom,'yyyy-MM-dd''T''HH:mm'):''}"></div><div class="col-6"><label>Kết thúc</label><input name="validUntil" type="datetime-local" class="form-control" th:value="${editVoucher.validUntil!=null?#temporals.format(editVoucher.validUntil,'yyyy-MM-dd''T''HH:mm'):''}"></div><div class="col-12"><label>Giới hạn lượt dùng</label><input name="usageLimit" type="number" min="1" class="form-control" th:value="${editVoucher.usageLimit}"></div><div class="col-12"><button class="btn btn-danger w-100" th:text="${editVoucher.id!=null?'Lưu thay đổi':'Tạo voucher'}"></button><a th:if="${editVoucher.id!=null}" th:href="@{/admin/vouchers}" class="btn btn-link text-light w-100 mt-2">Hủy sửa</a></div></div></form></div><div class="col-lg-8"><div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Mã</th><th>Ưu đãi</th><th>Đã dùng</th><th>Thời hạn</th><th></th></tr></thead><tbody><tr th:each="v:${vouchers}"><td><strong th:text="${v.code}"></strong><div class="small text-secondary" th:text="${v.name}"></div></td><td th:text="${v.discountType.name()=='PERCENT'? #numbers.formatDecimal(v.discountValue,0,0)+'%' : #numbers.formatDecimal(v.discountValue,0,'COMMA',0,'POINT')+'đ'}"></td><td th:text="${v.usedCount+(v.usageLimit!=null?' / '+v.usageLimit:'')}"></td><td><small th:text="${v.validUntil!=null?#temporals.format(v.validUntil,'dd/MM/yyyy HH:mm'):'Không giới hạn'}"></small></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-light" th:href="@{/admin/vouchers(edit=${v.id})}">Sửa</a><form th:action="@{'/admin/vouchers/'+${v.id}+'/toggle'}" method="post"><button class="btn btn-sm" th:classappend="${v.active?' btn-outline-danger':' btn-outline-success'}" th:text="${v.active?'Khóa':'Bật'}"></button></form></div></td></tr></tbody></table></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
