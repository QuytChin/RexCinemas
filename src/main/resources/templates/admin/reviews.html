<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý đánh giá</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-fluid admin-page-wrap pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">MODERATION</p><h1>Đánh giá phim</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div th:replace="~{fragments/admin-list :: filters}"></div><div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Khách hàng</th><th>Phim</th><th>Điểm</th><th>Nội dung</th><th>Ngày đánh giá</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="r:${reviews}"><td><span th:text="${r.user.fullName}"></span><div class="small text-secondary" th:text="${r.user.email}"></div></td><td th:text="${r.movie.title}"></td><td><span class="stars"><span th:each="n:${#numbers.sequence(1,5)}" th:text="${n<=r.rating?'★':'☆'}"></span></span></td><td class="review-cell" th:text="${r.comment}"></td><td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy')}"></td><td><form th:action="@{'/admin/reviews/'+${r.id}+'/delete'}" method="post"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr></tbody></table></div><div th:replace="~{fragments/admin-list :: pager}"></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
