<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Phòng chiếu</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page"><div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div><h1>Phòng chiếu & sơ đồ ghế</h1><form class="admin-form mt-4" th:action="@{/admin/auditoriums/save}" method="post"><div class="row g-3 align-items-end"><div class="col-md-3"><label>Rạp</label><select class="form-select" name="cinemaId"><option th:each="c:${cinemas}" th:value="${c.id}" th:text="${c.name}"></option></select></div><div class="col-md-3"><label>Tên phòng</label><input class="form-control" name="name" required></div><div class="col-md-2"><label>Số hàng</label><input class="form-control" type="number" min="1" max="20" name="totalRows" required></div><div class="col-md-2"><label>Ghế/hàng</label><input class="form-control" type="number" min="1" max="20" name="seatsPerRow" required></div><div class="col-md-2"><button class="btn btn-danger w-100">Tạo phòng</button></div></div></form><div class="table-responsive mt-4"><table class="table table-dark"><thead><tr><th>Phòng</th><th>Rạp</th><th>Kích thước</th></tr></thead><tbody><tr th:each="a:${auditoriums}"><td th:text="${a.name}"></td><td th:text="${a.cinema.name}"></td><td th:text="${a.totalRows+' hàng × '+a.seatsPerRow+' ghế'}"></td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
