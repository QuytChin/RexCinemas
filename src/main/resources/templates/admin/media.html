<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trailer & Clip</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-fluid admin-page-wrap pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">MEDIA LIBRARY</p><h1>Trailer & Clip</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div class="row g-4"><div class="col-xl-4"><form class="admin-form" th:action="@{/admin/media/save}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" th:value="${editMedia.id}"><h4 th:text="${editMedia.id==null?'Thêm media':'Sửa media'}"></h4><label>Tiêu đề *</label><input class="form-control mb-3" name="title" th:value="${editMedia.title}" required><label>Loại</label><select class="form-select mb-3" name="type"><option th:each="t:${mediaTypes}" th:value="${t}" th:text="${t}" th:selected="${editMedia.type==t}"></option></select><label>Video URL *</label><input class="form-control mb-3" name="videoUrl" th:value="${editMedia.videoUrl}" required><label>Thumbnail URL</label><input class="form-control mb-3" name="thumbnailUrl" th:value="${editMedia.thumbnailUrl}"><label>Hoặc upload thumbnail</label><input class="form-control mb-3" type="file" name="imageFile" accept="image/*"><label>Thứ tự</label><input class="form-control mb-3" type="number" name="sortOrder" th:value="${editMedia.sortOrder}"><button class="btn btn-rex w-100">LƯU MEDIA</button></form></div><div class="col-xl-8"><div class="table-responsive"><table class="table table-dark align-middle"><thead><tr><th>Thumbnail</th><th>Tiêu đề</th><th>Loại</th><th>URL</th><th>Hiển thị</th><th></th></tr></thead><tbody><tr th:each="m:${mediaItems}"><td><img class="admin-thumb" th:if="${m.thumbnailUrl!=null}" th:src="${m.thumbnailUrl}" alt=""></td><td><strong th:text="${m.title}"></strong></td><td th:text="${m.type}"></td><td><a class="text-warning" th:href="${m.videoUrl}" target="_blank">Mở video</a></td><td><span class="badge" th:classappend="${m.active?' text-bg-success':' text-bg-secondary'}" th:text="${m.active?'Có':'Ẩn'}"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-light" th:href="@{/admin/media(edit=${m.id})}">Sửa</a><form th:action="@{'/admin/media/'+${m.id}+'/toggle'}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${m.active?'Ẩn':'Hiện'}"></button></form><form th:action="@{'/admin/media/'+${m.id}+'/delete'}" method="post" onsubmit="return confirm('Xóa media?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr></tbody></table></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
