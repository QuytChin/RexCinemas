<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sự kiện</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-fluid admin-page-wrap pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">HOME CONTENT</p><h1>Sự kiện trang chủ</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div th:replace="~{fragments/admin-list :: filters}"></div><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div><div class="row g-4"><div class="col-xl-4"><form class="admin-form" th:action="@{/admin/events/save}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" th:value="${editEvent.id}"><h4 th:text="${editEvent.id==null?'Thêm sự kiện':'Sửa sự kiện'}"></h4><label>Nhãn</label><input class="form-control" name="label" th:value="${editEvent.label}" placeholder="ƯU ĐÃI THÀNH VIÊN"><label>Tiêu đề *</label><input class="form-control" name="title" th:value="${editEvent.title}" required><label>Mô tả</label><textarea class="form-control" rows="4" name="description" th:text="${editEvent.description}"></textarea><label>Ảnh sự kiện (URL)</label><input class="form-control" name="imageUrl" th:value="${editEvent.imageUrl}"><label>Hoặc tải ảnh lên</label><input class="form-control" type="file" name="imageFile" accept="image/*"><label>Link đích</label><input class="form-control" name="linkUrl" th:value="${editEvent.linkUrl}"><label>Thứ tự</label><input class="form-control" type="number" name="sortOrder" th:value="${editEvent.sortOrder}"><button class="btn btn-rex w-100 mt-3">LƯU SỰ KIỆN</button></form></div><div class="col-xl-8"><div class="table-responsive"><table class="table table-dark align-middle"><thead><tr><th>Mã</th><th>Ảnh</th><th>Nội dung</th><th>Thứ tự</th><th>Hiển thị</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="e:${events}"><td th:text="${e.id}"></td><td><img class="admin-thumb" th:src="${@cinemaArtwork.imageUrl(e.imageUrl, 'event')}" data-image-fallback="event" th:alt="${e.title}"></td><td><strong th:text="${e.title}"></strong><div class="small text-warning" th:text="${e.label}"></div><div class="small text-secondary" th:text="${e.description}"></div></td><td th:text="${e.sortOrder}"></td><td><span class="badge" th:classappend="${e.active?' text-bg-success':' text-bg-secondary'}" th:text="${e.active?'Có':'Ẩn'}"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-light" th:href="@{/admin/events(edit=${e.id})}">Sửa</a><form th:action="@{'/admin/events/'+${e.id}+'/toggle'}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${e.active?'Ẩn':'Hiện'}"></button></form><form th:action="@{'/admin/events/'+${e.id}+'/delete'}" method="post" onsubmit="return confirm('Xóa sự kiện?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr></tbody></table></div></div></div><div th:replace="~{fragments/admin-list :: pager}"></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
