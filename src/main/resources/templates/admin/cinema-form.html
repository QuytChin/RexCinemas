<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form rạp</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-fluid admin-page-wrap pt-page pb-5"><div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div><header class="ui-page-header"><div><p class="eyebrow">CINEMA MANAGEMENT</p><h1>Thông tin rạp</h1></div><a class="btn btn-outline-light" th:href="@{/admin/cinemas}">Quay lại</a></header><form class="admin-form mt-4" th:action="@{/admin/cinemas/save}" method="post"><input type="hidden" name="id" th:value="${cinema.id}"><div class="row g-3"><div class="col-md-6"><label>Tên rạp</label><input class="form-control" name="name" th:value="${cinema.name}" required></div><div class="col-md-6"><label>Thành phố</label><input class="form-control" name="city" th:value="${cinema.city}" required></div><div class="col-12"><label>Địa chỉ</label><input class="form-control" name="address" th:value="${cinema.address}" required></div><div class="col-md-6"><label>Điện thoại</label><input class="form-control" name="phone" th:value="${cinema.phone}"></div></div><button class="btn btn-rex mt-4">Lưu</button></form></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
