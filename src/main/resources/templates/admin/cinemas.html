<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rạp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container pt-page pb-5 admin-cinema-page">
    <div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div>
    <div class="admin-title admin-cinema-page-header">
        <div>
            <p class="eyebrow mb-1">CINEMA NETWORK</p>
            <h1>Chuỗi rạp</h1>
        </div>
        <a class="btn btn-rex admin-cinema-add" th:href="@{/admin/cinemas/new}">+ Thêm rạp</a>
    </div>

    <div class="row g-3 mt-2 admin-cinema-grid">
        <div class="col-md-6" th:each="c:${cinemas}">
            <article class="admin-card admin-cinema-card">
                <div class="admin-cinema-card-content">
                    <h4 class="admin-cinema-card-title" th:text="${c.name}"></h4>
                    <p class="admin-cinema-card-address" th:text="${c.address}"></p>
                    <div class="admin-cinema-badges">
                        <span class="badge admin-cinema-badge admin-cinema-location" th:text="${c.city}"></span>
                        <span class="badge admin-cinema-badge" th:classappend="${c.active ? ' text-bg-success' : ' text-bg-dark'}" th:text="${c.active ? 'Hoạt động' : 'Đã ẩn'}"></span>
                    </div>
                </div>
                <div class="admin-cinema-actions">
                    <a class="btn btn-sm btn-outline-light admin-cinema-edit" th:href="@{'/admin/cinemas/'+${c.id}+'/edit'}">Sửa</a>
                    <form class="d-inline" th:action="@{'/admin/cinemas/'+${c.id}+'/toggle'}" method="post">
                        <button class="btn btn-sm admin-cinema-toggle" th:classappend="${c.active ? ' btn-outline-danger' : ' btn-outline-success'}" th:text="${c.active ? 'Ẩn' : 'Bật lại'}"></button>
                    </form>
                </div>
            </article>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
