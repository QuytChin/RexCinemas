<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Rạp</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page"><div class="mb-4" th:replace="~{fragments/admin-nav :: adminNav}"></div><div class="d-flex justify-content-between"><h1>Chuỗi rạp</h1><a class="btn btn-danger" th:href="@{/admin/cinemas/new}">+ Thêm rạp</a></div><div class="row g-3 mt-2"><div class="col-md-6" th:each="c:${cinemas}"><div class="admin-card"><h4 th:text="${c.name}"></h4><p th:text="${c.address}"></p><span class="badge text-bg-secondary" th:text="${c.city}"></span> <span class="badge" th:classappend="${c.active ? ' text-bg-success' : ' text-bg-dark'}" th:text="${c.active ? 'Hoạt động' : 'Đã ẩn'}"></span><div class="mt-3"><a class="btn btn-sm btn-outline-light" th:href="@{'/admin/cinemas/'+${c.id}+'/edit'}">Sửa</a><form class="d-inline" th:action="@{'/admin/cinemas/'+${c.id}+'/toggle'}" method="post"><button class="btn btn-sm" th:classappend="${c.active ? ' btn-outline-danger' : ' btn-outline-success'}" th:text="${c.active ? 'Ẩn' : 'Bật lại'}"></button></form></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
