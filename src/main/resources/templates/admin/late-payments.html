<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiền đến muộn</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div>
<main class="container pt-page pb-5"><p class="eyebrow">PAYMENT RECONCILIATION</p><h1 class="fw-bold">Tiền đến muộn</h1><p class="text-secondary">Tiền hợp lệ về sau khi booking đã hết hạn. Hệ thống không xác nhận lại ghế.</p>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form class="row g-2 mb-3" method="get"><div class="col-md-4"><input name="q" class="form-control" placeholder="Mã booking, giao dịch, email" th:value="${filterQuery}"></div><div class="col-md-3"><select name="status" class="form-select"><option value="">Tất cả trạng thái</option><option th:each="s:${caseStatuses}" th:value="${s}" th:selected="${s == filterStatus}" th:text="${s}"></option></select></div><div class="col-md-2"><label class="form-label">Sắp xếp<select class="form-select" name="sort"><option th:each="value:${adminSorts}" th:value="${value}" th:text="${value}" th:selected="${value==adminSort}"></option></select></label></div><div class="col-md-1"><label class="form-label">Chiều<select class="form-select" name="dir"><option value="desc" th:selected="${adminDir=='desc'}">Giảm</option><option value="asc" th:selected="${adminDir=='asc'}">Tăng</option></select></label></div><div class="col-md-1"><label class="form-label">Mỗi trang<select class="form-select" name="size"><option value="10" th:selected="${adminPage.size==10}">10</option><option value="20" th:selected="${adminPage.size==20}">20</option><option value="50" th:selected="${adminPage.size==50}">50</option><option value="100" th:selected="${adminPage.size==100}">100</option></select></label></div><div class="col-md-auto"><button class="btn btn-warning fw-bold">Lọc</button></div></form>
<div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Booking</th><th>Khách</th><th>Giao dịch</th><th>Số tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="c:${cases}"><td th:text="${c.booking.bookingCode}"></td><td th:text="${c.booking.user.email}"></td><td th:text="${c.providerTransactionId}"></td><td th:text="${#numbers.formatDecimal(c.amount,0,'COMMA',0,'POINT') + 'đ'}"></td><td><span class="badge text-bg-warning" th:text="${c.status}"></span></td><td><a class="btn btn-sm btn-outline-warning" th:href="@{'/admin/late-payments/'+${c.id}}">Đối soát</a></td></tr><tr th:if="${#lists.isEmpty(cases)}"><td colspan="6" class="text-center text-secondary">Không có hồ sơ phù hợp.</td></tr></tbody></table></div>
<div th:replace="~{fragments/admin-list :: pager}"></div></main></body></html>
