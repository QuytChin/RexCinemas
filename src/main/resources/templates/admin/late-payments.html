<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiền đến muộn</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5"><header class="ui-page-header"><div><p class="eyebrow">PAYMENT RECONCILIATION</p><h1>Tiền đến muộn</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></header>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:replace="~{fragments/admin-list :: filters}"></div>
<div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Mã đặt vé</th><th>Khách hàng</th><th>Mã giao dịch</th><th>Số tiền</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead><tbody><tr th:each="c:${cases}"><td th:text="${c.booking.bookingCode}"></td><td th:text="${c.booking.user.email}"></td><td th:text="${c.providerTransactionId}"></td><td th:text="${#numbers.formatDecimal(c.amount,0,'COMMA',0,'POINT') + 'đ'}"></td><td><span class="badge text-bg-warning" th:text="${@uiText.label(c.status)}"></span></td><td><a class="btn btn-sm btn-outline-warning" th:href="@{'/admin/late-payments/'+${c.id}}">Đối soát</a></td></tr><tr th:if="${#lists.isEmpty(cases)}"><td colspan="6" class="text-center text-secondary">Không có hồ sơ phù hợp.</td></tr></tbody></table></div>
<div th:replace="~{fragments/admin-list :: pager}"></div></main></body></html>
