<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quét QR Check-in - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="admin-title"><div><p class="eyebrow">KIỂM SOÁT VÉ</p><h1>Quét vé QR</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div>

    <div class="row g-4 mt-2">
        <div class="col-xl-7">
            <div class="scanner-card">
                <div class="scanner-head"><div><span class="live-dot"></span><strong>Camera scanner</strong></div><small>Camera hoạt động trên localhost hoặc HTTPS</small></div>
                <div id="reader" class="qr-reader"></div>
                <div class="scanner-manual mt-3">
                    <label class="form-label">Hoặc nhập mã booking</label>
                    <div class="input-group"><input id="manualCode" class="form-control form-control-lg" placeholder="Ví dụ REX12AB34CD"><button id="manualScanBtn" class="btn btn-rex">KIỂM TRA & CHECK-IN</button></div>
                </div>
            </div>
        </div>
        <div class="col-xl-5">
            <div id="scanResult" class="scan-result empty">
                <div class="scan-icon">QR</div><h3>Chờ quét vé</h3><p>Thông tin phim, rạp, phòng, ghế và khách hàng sẽ hiện tại đây.</p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/admin-list :: filters}"></div><section class="mt-5"><div class="d-flex justify-content-between align-items-end mb-3"><div><p class="eyebrow mb-1">RECENT</p><h3>Check-in gần đây</h3></div></div>
        <div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Mã đặt vé</th><th>Khách hàng</th><th>Phim</th><th>Rạp / Phòng</th><th>Ghế</th><th>Giờ check-in</th></tr></thead><tbody><tr th:each="b:${recentCheckins}"><td><strong th:text="${b.bookingCode}"></strong></td><td th:text="${b.user.fullName}"></td><td th:text="${b.showtime.movie.title}"></td><td th:text="${b.showtime.auditorium.cinema.name+' / '+b.showtime.auditorium.name}"></td><td><span th:each="s,i:${b.seats}" th:text="${s.seatLabel+(i.last?'':', ')}"></span></td><td><span class="badge text-bg-info" th:text="${#temporals.format(b.checkedInAt,'HH:mm dd/MM')}"></span><div class="small text-secondary" th:text="${b.checkedInBy}"></div></td></tr><tr th:if="${recentCheckins.isEmpty()}"><td colspan="6" class="text-center text-secondary py-4">Chưa có lượt check-in nào.</td></tr></tbody></table></div>
    </section>
<div th:replace="~{fragments/admin-list :: pager}"></div></main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script th:src="@{/js/checkin.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
