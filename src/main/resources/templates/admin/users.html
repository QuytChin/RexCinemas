<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý người dùng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-fluid admin-page-wrap pt-page pb-5"><div class="admin-title"><div><p class="eyebrow">ADMIN ONLY</p><h1>Người dùng & Rex Member</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div><div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Hạng</th><th>Điểm</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td><span class="badge text-bg-dark" th:text="${u.membershipTier}"></span></td><td><strong th:text="${u.loyaltyPoints}"></strong><div class="small text-secondary" th:text="${u.lifetimePoints+' lifetime'}"></div></td><td><form th:action="@{'/admin/users/'+${u.id}+'/role'}" method="post" class="d-flex gap-2"><select name="role" class="form-select form-select-sm"><option th:each="r:${roles}" th:value="${r}" th:text="${r}" th:selected="${r==u.role}"></option></select><button class="btn btn-outline-light btn-sm">Lưu</button></form></td><td><span class="badge" th:classappend="${u.enabled?' text-bg-success':' text-bg-secondary'}" th:text="${u.enabled?'Hoạt động':'Đã khóa'}"></span></td><td><form th:action="@{'/admin/users/'+${u.id}+'/toggle'}" method="post"><button class="btn btn-sm" th:classappend="${u.enabled?' btn-outline-danger':' btn-outline-success'}" th:text="${u.enabled?'Khóa':'Mở khóa'}"></button></form></td></tr></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
