<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid admin-page-wrap pt-page pb-5">
    <div class="admin-title"><div><p class="eyebrow">ORDERS & GATE</p><h1>Danh sách booking</h1></div><div th:replace="~{fragments/admin-nav :: adminNav}"></div></div>
    <div th:replace="~{fragments/admin-list :: filters}"></div>
    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
    <div class="d-flex justify-content-end mb-3"><a class="btn btn-rex" th:href="@{/admin/checkin}">▣ MỞ MÁY QUÉT QR</a></div>
    <div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Mã</th><th>Khách</th><th>Phim / Rạp</th><th>Ghế + Combo</th><th>Thanh toán</th><th>Tổng</th><th>Vé / Check-in</th><th></th></tr></thead><tbody>
        <tr th:each="b:${bookings}">
            <td><strong th:text="${b.bookingCode}"></strong><div class="small text-secondary" th:text="${#temporals.format(b.createdAt,'dd/MM HH:mm')}"></div></td>
            <td><span th:text="${b.user.fullName}"></span><div class="small text-secondary" th:text="${b.user.email}"></div></td>
            <td><span th:text="${b.showtime.movie.title}"></span><div class="small text-secondary" th:text="${b.showtime.auditorium.cinema.name+' / '+b.showtime.auditorium.name}"></div><div class="small" th:text="${#temporals.format(b.showtime.startTime,'HH:mm dd/MM/yyyy')}"></div></td>
            <td><div><span th:each="s,i:${b.seats}" th:text="${s.seatLabel+(i.last?'':', ')}"></span></div><div class="small text-secondary" th:if="${b.comboAmount.signum()>0}" th:text="${'Combo: '+#numbers.formatDecimal(b.comboAmount,0,'COMMA',0,'POINT')+'đ'}"></div></td>
            <td><span th:text="${b.paymentMethod}"></span><div class="small text-secondary" th:if="${b.paymentReference!=null}" th:text="${b.paymentReference}"></div><div class="small" th:if="${b.voucherCode!=null}" th:text="${'Voucher: '+b.voucherCode}"></div></td>
            <td><strong th:text="${#numbers.formatDecimal(b.totalAmount,0,'COMMA',0,'POINT')+'đ'}"></strong></td>
            <td>
                <span class="badge" th:classappend="${b.status.name()=='CONFIRMED'?' text-bg-success':(b.status.name()=='PENDING'?' text-bg-warning':(b.status.name()=='REFUND_PENDING'?' text-bg-danger text-white':(b.status.name()=='REFUNDED'?' text-bg-info':' text-bg-secondary')))}" th:text="${@uiText.label(b.status)}"></span>
                <div class="mt-2"><span class="badge text-bg-info" th:if="${b.checkedIn}">ĐÃ CHECK-IN</span><span class="badge text-bg-dark border" th:if="${b.status.name()=='CONFIRMED' and !b.checkedIn}">CHƯA CHECK-IN</span></div>
                <div class="small text-secondary mt-1" th:if="${b.checkedInAt!=null}" th:text="${#temporals.format(b.checkedInAt,'HH:mm dd/MM')}"></div>
                <div class="small text-warning mt-1" th:if="${b.refundedAt!=null}" th:text="${'Hoàn: '+#temporals.format(b.refundedAt,'HH:mm dd/MM')}"></div>
                <div class="small text-secondary mt-1" th:if="${b.status.name()=='REFUND_PENDING'}">Chưa xác nhận tiền đã về khách</div>
                <div class="small text-info mt-1" th:if="${b.refundedAt!=null}" th:text="${'Mã chứng từ: '+b.refundReference}"></div>
            </td>
            <td>
                <div class="d-grid gap-2">
                    <a class="btn btn-sm btn-outline-light" th:href="@{'/bookings/'+${b.id}}">Xem vé / QR</a>
                    <form th:if="${b.status.name()=='REFUND_PENDING'}" th:action="@{'/admin/bookings/'+${b.id}+'/refund'}" method="post" class="border border-warning rounded p-2 small" onsubmit="return confirm('Chỉ tiếp tục khi bạn đã chuyển khoản hoàn tiền thủ công và có mã chứng từ. Xác nhận?')">
                        <div class="fw-semibold text-warning mb-2">Xác nhận hoàn thủ công</div>
                        <input class="form-control form-control-sm mb-2" name="refundReference" maxlength="120" required placeholder="Mã tham chiếu / chứng từ chuyển khoản">
                        <input class="form-control form-control-sm mb-2" name="refundAmount" type="number" min="0.01" step="0.01" required th:value="${b.totalAmount}" aria-label="Số tiền hoàn">
                        <input class="form-control form-control-sm mb-2" name="refundEvidence" maxlength="600" placeholder="Bằng chứng (URL hoặc mô tả, nếu có)">
                        <textarea class="form-control form-control-sm mb-2" name="note" maxlength="255" rows="2" placeholder="Ghi chú đối soát (nếu có)"></textarea>
                        <label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="manualTransferConfirmed" value="true" required> <span class="form-check-label">Tôi đã chuyển khoản và đối soát chứng từ.</span></label>
                        <button class="btn btn-sm btn-warning w-100">Xác nhận đã hoàn</button>
                    </form>
                    <form th:if="${b.status.name()!='CANCELLED' and b.status.name()!='REFUND_PENDING' and b.status.name()!='REFUNDED' and !b.checkedIn}" th:action="@{'/admin/bookings/'+${b.id}+'/cancel'}" method="post" onsubmit="return confirm('Hủy booking này và trả ghế?')">
                        <button class="btn btn-sm btn-outline-danger w-100">Hủy</button>
                    </form>
                </div>
            </td>
        </tr>
    </tbody></table></div>
<div th:replace="~{fragments/admin-list :: pager}"></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
