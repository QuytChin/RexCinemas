<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="filters" class="admin-list-toolbar">
  <form method="get" th:action="${adminBase}" class="admin-list-toolbar__form">
    <div class="admin-filter-field admin-filter-field--search"><label class="form-label" for="admin-q">Tìm kiếm</label><div class="admin-search-input"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#search"></use></svg><input id="admin-q" class="form-control" type="search" name="q" th:value="${adminQuery}" placeholder="Tên, mã hoặc email"></div></div>
    <div class="admin-filter-field admin-filter-field--status" th:if="${adminStatuses.length > 0}"><label class="form-label" for="admin-status">Trạng thái</label><select id="admin-status" name="status" class="form-select"><option value="">Tất cả</option><option th:each="value : ${adminStatuses}" th:value="${value}" th:text="${@uiText.label(value)}" th:selected="${value == adminStatus}"></option></select></div>
    <div class="admin-filter-field admin-filter-field--sort"><label class="form-label" for="admin-sort">Sắp xếp theo</label><select id="admin-sort" name="sort" class="form-select"><option th:each="value : ${adminSorts}" th:value="${value}" th:text="${@uiText.label(value)}" th:selected="${value == adminSort}"></option></select></div>
    <div class="admin-filter-field admin-filter-field--direction"><label class="form-label" for="admin-dir">Thứ tự</label><select id="admin-dir" name="dir" class="form-select"><option value="desc" th:selected="${adminDir == 'desc'}">Giảm dần</option><option value="asc" th:selected="${adminDir == 'asc'}">Tăng dần</option></select></div>
    <div class="admin-filter-field admin-filter-field--size"><label class="form-label" for="admin-size">Số dòng</label><select id="admin-size" name="size" class="form-select"><option value="10" th:selected="${adminPage.size == 10}">10 / trang</option><option value="20" th:selected="${adminPage.size == 20}">20 / trang</option><option value="50" th:selected="${adminPage.size == 50}">50 / trang</option><option value="100" th:selected="${adminPage.size == 100}">100 / trang</option></select></div>
    <div class="admin-list-toolbar__actions"><button class="btn btn-rex ui-btn ui-btn--primary" type="submit"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#filter"></use></svg><span>Áp dụng</span></button><a class="btn btn-outline-light ui-btn ui-btn--secondary" th:href="${adminBase}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#refresh-cw"></use></svg><span>Xóa lọc</span></a></div>
  </form>
</div>
<div th:fragment="pager" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3 mb-4">
  <p class="small text-secondary mb-0" th:text="${adminPage.totalElements == 0 ? 'Không tìm thấy dữ liệu phù hợp.' : 'Trang ' + (adminPage.number + 1) + '/' + adminPage.totalPages + ' · ' + adminPage.totalElements + ' bản ghi'}"></p>
  <nav aria-label="Phân trang Admin" class="d-flex flex-wrap gap-2" th:if="${adminPage.totalPages > 1}">
    <a class="btn btn-sm btn-outline-light" th:if="${adminPage.hasPrevious()}" th:href="${adminFirst}">Đầu</a>
    <a class="btn btn-sm btn-outline-light" th:if="${adminPage.hasPrevious()}" th:href="${adminPrev}">Trước</a>
    <a class="btn btn-sm btn-outline-light" th:if="${adminPage.hasNext()}" th:href="${adminNext}">Sau</a>
    <a class="btn btn-sm btn-outline-light" th:if="${adminPage.hasNext()}" th:href="${adminLast}">Cuối</a>
  </nav>
</div>
</body></html>
