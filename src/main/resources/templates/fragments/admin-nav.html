<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="adminNav">
    <button class="admin-sidebar-toggle" type="button" aria-controls="adminSidebar" aria-expanded="false">
        <svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#settings"></use></svg>
        <span>Menu quản trị</span>
    </button>
    <button class="admin-sidebar-backdrop" type="button" aria-label="Đóng menu quản trị" tabindex="-1"></button>

    <aside id="adminSidebar" class="admin-sidebar" aria-label="Điều hướng quản trị">
        <div class="admin-sidebar-head">
            <a class="admin-sidebar-brand" th:href="@{/admin}" aria-label="Rex Chain Cinemas Admin">
                <img class="admin-sidebar-logo" th:src="@{/images/rex-chain-cinemas-logo-header.webp}" alt="Rex Chain Cinemas">
            </a>
            <button class="admin-sidebar-close ui-icon-btn" type="button" aria-label="Đóng menu"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#x"></use></svg></button>
        </div>

        <div class="admin-sidebar-role">
            <span class="admin-role-badge" sec:authorize="hasRole('ADMIN')">QUẢN TRỊ HỆ THỐNG</span>
            <span class="admin-role-badge" sec:authorize="hasRole('CINEMA_MANAGER')">TỔNG QUẢN LÝ</span>
            <span class="admin-role-badge" sec:authorize="hasRole('SUPERVISOR')">GIÁM SÁT RẠP</span>
            <span class="admin-role-badge" sec:authorize="hasRole('STAFF')">NHÂN VIÊN SOÁT VÉ</span>
            <span sec:authentication="name"></span>
        </div>

        <nav class="admin-sidebar-menu">
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER', 'SUPERVISOR')" data-admin-route="/admin" th:href="@{/admin}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#chart-column"></use></svg><span>Tổng quan</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER')" data-admin-route="/admin/movies" th:href="@{/admin/movies}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#clapperboard"></use></svg><span>Phim</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER')" data-admin-route="/admin/cinemas" th:href="@{/admin/cinemas}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#building-2"></use></svg><span>Rạp</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER')" data-admin-route="/admin/auditoriums" th:href="@{/admin/auditoriums}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#building-2"></use></svg><span>Phòng chiếu</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER', 'SUPERVISOR')" data-admin-route="/admin/showtimes" th:href="@{/admin/showtimes}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#calendar-clock"></use></svg><span>Suất chiếu</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER', 'SUPERVISOR')" data-admin-route="/admin/bookings" th:href="@{/admin/bookings}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#ticket"></use></svg><span>Đặt vé</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR', 'STAFF')" data-admin-route="/admin/checkin" th:href="@{/admin/checkin}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#scan-line"></use></svg><span>Quét vé QR</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR')" data-admin-route="/admin/support" th:href="@{/admin/support}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#info"></use></svg><span>Tin nhắn hỗ trợ</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/combos" th:href="@{/admin/combos}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#gift"></use></svg><span>Combo / F&amp;B</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/vouchers" th:href="@{/admin/vouchers}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#ticket"></use></svg><span>Voucher</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/reviews" th:href="@{/admin/reviews}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#chart-column"></use></svg><span>Đánh giá</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/events" th:href="@{/admin/events}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#calendar-clock"></use></svg><span>Sự kiện</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/articles" th:href="@{/admin/articles}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#pencil"></use></svg><span>Bài viết</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/media" th:href="@{/admin/media}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#clapperboard"></use></svg><span>Video &amp; hình ảnh</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR')" data-admin-route="/admin/users" th:href="@{/admin/users}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#users"></use></svg><span>Người dùng</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/payments" th:href="@{/admin/payments}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#credit-card"></use></svg><span>Thanh toán</span></a>
            <a sec:authorize="hasAnyRole('ADMIN', 'CINEMA_MANAGER')" data-admin-route="/admin/transactions" th:href="@{/admin/transactions}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#receipt"></use></svg><span>Giao dịch</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/late-payments" th:href="@{/admin/late-payments}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#receipt"></use></svg><span>Tiền đến muộn</span></a>
            <a sec:authorize="hasRole('ADMIN')" data-admin-route="/admin/rewards" th:href="@{/admin/rewards}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#coins"></use></svg><span>Rex Rewards</span></a>
        </nav>

        <div class="admin-sidebar-footer">
            <a th:href="@{/}"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#arrow-left"></use></svg><span>Về trang khách</span></a>
            <form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post">
                <button type="submit"><svg class="ui-icon" aria-hidden="true"><use href="/images/icons.svg#log-out"></use></svg><span>Đăng xuất</span></button>
            </form>
        </div>
    </aside>
    <script th:src="@{/js/admin-layout.js}" defer></script>
</th:block>
</body>
</html>
