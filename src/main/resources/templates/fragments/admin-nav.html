<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<div th:fragment="adminNav" class="admin-sidebar-shell"><button class="admin-sidebar-toggle" type="button" onclick="document.body.classList.toggle('admin-sidebar-open')" aria-label="Mở menu quản trị">MENU</button><aside class="admin-sidebar">
<div class="admin-sidebar-head"><img class="admin-sidebar-logo" th:src="@{/images/rex-chain-cinemas-logo.png}" alt="Rex Chain Cinemas"><span class="admin-role-badge" sec:authorize="hasRole('ADMIN')">ADMIN</span><span class="admin-role-badge manager" sec:authorize="hasRole('CINEMA_MANAGER')">MANAGER</span></div>
<nav class="admin-sidebar-menu" aria-label="Menu quản trị">
<a th:classappend="${#request.requestURI == '/admin' ? ' active' : ''}" th:href="@{/admin}">Dashboard</a><a th:classappend="${#request.requestURI.startsWith('/admin/movies') ? ' active' : ''}" th:href="@{/admin/movies}">Phim</a><a th:classappend="${#request.requestURI.startsWith('/admin/cinemas') ? ' active' : ''}" th:href="@{/admin/cinemas}">Rạp</a><a th:classappend="${#request.requestURI.startsWith('/admin/auditoriums') ? ' active' : ''}" th:href="@{/admin/auditoriums}">Phòng chiếu</a><a th:classappend="${#request.requestURI.startsWith('/admin/showtimes') ? ' active' : ''}" th:href="@{/admin/showtimes}">Suất chiếu</a><a th:classappend="${#request.requestURI.startsWith('/admin/bookings') ? ' active' : ''}" th:href="@{/admin/bookings}">Booking</a><a class="checkin-nav-link" th:classappend="${#request.requestURI.startsWith('/admin/checkin') ? ' active' : ''}" th:href="@{/admin/checkin}">Check-in QR</a><a th:classappend="${#request.requestURI.startsWith('/admin/combos') ? ' active' : ''}" th:href="@{/admin/combos}">Combo / F&amp;B</a><a th:classappend="${#request.requestURI.startsWith('/admin/vouchers') ? ' active' : ''}" th:href="@{/admin/vouchers}">Voucher</a><a th:classappend="${#request.requestURI.startsWith('/admin/reviews') ? ' active' : ''}" th:href="@{/admin/reviews}">Review</a><a th:classappend="${#request.requestURI.startsWith('/admin/events') ? ' active' : ''}" th:href="@{/admin/events}">Sự kiện</a><a th:classappend="${#request.requestURI.startsWith('/admin/articles') ? ' active' : ''}" th:href="@{/admin/articles}">Bài viết</a><a th:classappend="${#request.requestURI.startsWith('/admin/media') ? ' active' : ''}" th:href="@{/admin/media}">Media</a><a sec:authorize="hasRole('ADMIN')" th:classappend="${#request.requestURI.startsWith('/admin/users') ? ' active' : ''}" th:href="@{/admin/users}">Người dùng</a>
</nav><div class="admin-sidebar-footer"><a th:href="@{/}">Về trang khách</a><form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post"><button type="submit">Đăng xuất</button></form></div>
</aside></div></body></html>
