<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="footer">
<footer class="rex-footer">
    <div class="container-xl py-5">
        <div class="row g-4">
            <div class="col-lg-4"><a class="rex-brand footer-brand" th:href="@{/}" aria-label="Rex Chain Cinemas"><img class="site-logo footer-logo" th:src="@{/images/rex-chain-cinemas-logo.webp}" alt="Rex Chain Cinemas" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="site-logo-fallback" hidden>REX</span></a><p class="text-secondary mt-3 mb-0">Hệ thống quản lý và đặt vé xem phim trực tuyến theo mô hình chuỗi rạp.</p></div>
            <div class="col-6 col-lg-2"><h6>KHÁM PHÁ</h6><a th:href="@{/schedule}">Lịch chiếu</a><a th:href="@{/movies(status='now')}">Đang chiếu</a><a th:href="@{/movies(status='coming')}">Sắp chiếu</a></div>

        </div>
        <div class="footer-bottom mt-5 pt-3"><span>© 2026 Rex Chain Cinemas</span><span>Student project • Demo environment</span></div>
    </div>
</footer>
<div th:replace="~{fragments/trailer-modal :: trailerModal}"></div>
<script th:src="@{/js/trailer-modal.js}" defer></script>
</th:block></body></html>
