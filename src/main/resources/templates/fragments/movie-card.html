<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<article class="rex-movie-card" th:fragment="card(movie, actionLabel, showAge, showRelease)" th:if="${movie != null}">
    <a class="poster-link" th:href="@{'/movies/'+${movie.id}}">
        <img th:src="${@cinemaArtwork.imageUrl(movie.posterUrl, 'movie')}" data-image-fallback="movie" th:alt="${movie.title}">
        <span class="age-tag" th:if="${showAge and movie.ageRating != null}" th:text="${movie.ageRating}"></span>
        <span class="release-ribbon" th:if="${showRelease and movie.releaseDate != null}"
              th:text="${#temporals.format(movie.releaseDate,'dd/MM')}"></span>
        <span class="poster-hover" th:text="${actionLabel}"></span>
        <span class="poster-info" aria-hidden="true">
            <strong class="poster-info-title" th:text="${movie.title}"></strong>
            <span class="poster-info-meta" th:if="${movie.genre != null and !#strings.isEmpty(movie.genre)}">
                <span class="poster-info-icon">◆</span><span th:text="${movie.genre}"></span>
            </span>
            <span class="poster-info-meta" th:if="${movie.durationMinutes > 0}">
                <span class="poster-info-icon">◷</span><span th:text="${movie.durationMinutes + ' phút'}"></span>
            </span>
            <span class="poster-info-meta" th:if="${movie.language != null and !#strings.isEmpty(movie.language)}">
                <span class="poster-info-icon">文</span><span th:text="${movie.language}"></span>
            </span>
            <span class="poster-info-meta" th:if="${movie.ageRating != null}">
                <span class="poster-info-icon">★</span><span th:text="${movie.ageRating}"></span>
            </span>
        </span>
    </a>
    <div class="movie-card-body">
        <h3 th:text="${movie.title}"></h3>
        <p th:if="${movie.genre != null and !#strings.isEmpty(movie.genre)}" th:text="${movie.genre}"></p>
        <small class="movie-card-language" th:if="${movie.language != null and !#strings.isEmpty(movie.language)}"
               th:text="${movie.language}"></small>
        <div class="movie-card-meta">
            <span th:if="${showRelease and movie.releaseDate != null}"
                  th:text="${#temporals.format(movie.releaseDate,'dd/MM/yyyy')}"></span>
            <span th:unless="${showRelease}" th:text="${movie.durationMinutes + ' phút'}"></span>
        </div>
        <div class="movie-card-actions">
            <button class="movie-card-trailer js-trailer-trigger" type="button"
                    th:if="${movie.trailerUrl != null and !#strings.isEmpty(movie.trailerUrl)}"
                    th:attr="data-trailer-url=${movie.trailerUrl},data-trailer-title=${movie.title}">
                <span aria-hidden="true">▶</span> Xem Trailer
            </button>
            <span class="movie-card-trailer is-disabled" th:unless="${movie.trailerUrl != null and !#strings.isEmpty(movie.trailerUrl)}"
                  aria-disabled="true"><span aria-hidden="true">▶</span> Xem Trailer</span>
            <a class="movie-card-booking" th:href="@{'/movies/'+${movie.id}}">ĐẶT VÉ NGAY</a>
        </div>
    </div>
</article>
</body>
</html>
