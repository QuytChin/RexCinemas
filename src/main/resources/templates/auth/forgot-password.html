<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quên mật khẩu - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page auth-login-page">
<div th:replace="~{fragments/header :: header}"></div>
<main class="auth-layout">
    <section class="auth-panel-wrap" aria-labelledby="forgot-password-title">
        <div class="auth-panel">
            <nav class="auth-tabs" aria-label="Tài khoản">
                <a class="auth-tab is-active" aria-current="page" th:href="@{/auth/forgot-password}">KHÔI PHỤC MẬT KHẨU</a>
                <a class="auth-tab" th:href="@{/auth/login}">ĐĂNG NHẬP</a>
            </nav>
            <div class="auth-panel-heading">
                <h1 id="forgot-password-title">Quên mật khẩu</h1>
                <p>Nhận mã OTP qua Gmail để đặt lại mật khẩu an toàn.</p>
            </div>
            <div id="resetAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="reset-request-step">
                <form id="resetRequestForm" class="auth-form">
                    <input type="hidden" id="csrfToken" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="auth-field">
                        <label for="resetEmail">Email tài khoản <span>*</span></label>
                        <input id="resetEmail" class="form-control" type="email" autocomplete="email" maxlength="150" required placeholder="Nhập email đã đăng ký">
                    </div>
                    <button id="btnSendResetOtp" class="btn auth-submit" type="submit">GỬI MÃ OTP</button>
                </form>
            </div>
            <div id="reset-verify-step" class="d-none">
                <p class="auth-reset-note">Mã OTP đã được gửi nếu email này có tài khoản. Mã có hiệu lực trong 5 phút.</p>
                <form id="resetVerifyForm" class="auth-form">
                    <div class="auth-field">
                        <label for="resetOtp">Mã OTP <span>*</span></label>
                        <input id="resetOtp" class="form-control otp-input-large" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required placeholder="Nhập 6 chữ số">
                    </div>
                    <div class="auth-field">
                        <label for="resetNewPassword">Mật khẩu mới <span>*</span></label>
                        <div class="password-control">
                            <input id="resetNewPassword" class="form-control" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Ít nhất 8 ký tự, gồm chữ và số">
                            <button type="button" class="password-toggle" data-password-toggle="resetNewPassword" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="resetConfirmPassword">Xác nhận mật khẩu mới <span>*</span></label>
                        <div class="password-control">
                            <input id="resetConfirmPassword" class="form-control" type="password" minlength="8" maxlength="72" autocomplete="new-password" required data-confirm-password="resetNewPassword" placeholder="Nhập lại mật khẩu mới">
                            <button type="button" class="password-toggle" data-password-toggle="resetConfirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button>
                        </div>
                    </div>
                    <button id="btnVerifyReset" class="btn auth-submit" type="submit">XÁC NHẬN & ĐẶT LẠI</button>
                </form>
            </div>
            <p class="auth-switch"><a th:href="@{/auth/login}">Quay lại đăng nhập</a></p>
        </div>
    </section>
</main>
<script th:src="@{/js/auth-form.js}" defer></script>
<script th:src="@{/js/password-reset.js}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
