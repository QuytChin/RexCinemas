<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-bg"><div class="auth-card"><a th:href="@{/}" class="brand-big">R</a><h2>Tạo tài khoản</h2><p class="text-secondary">Một tài khoản cho toàn bộ chuỗi rạp.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/auth/register}" method="post" class="d-grid gap-3"><input class="form-control" name="fullName" placeholder="Họ và tên" required><input class="form-control" type="email" name="email" placeholder="Email" required><input class="form-control" name="phone" placeholder="Số điện thoại"><input class="form-control" type="password" name="password" placeholder="Mật khẩu" minlength="6" required><button class="btn btn-danger btn-lg">Đăng ký</button></form><p class="mt-4">Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a></p></div></body></html>
