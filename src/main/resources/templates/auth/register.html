<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng ký - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page auth-register-page">
<div th:replace="~{fragments/header :: header}"></div>
<main class="auth-layout">
    <section class="auth-panel-wrap" aria-labelledby="register-title">
        <div class="auth-panel auth-panel-register">
            <nav class="auth-tabs" aria-label="Tài khoản">
                <a class="auth-tab" th:href="@{/auth/login}">ĐĂNG NHẬP</a>
                <a class="auth-tab is-active" aria-current="page" th:href="@{/auth/register}">ĐĂNG KÝ</a>
            </nav>
            <div class="auth-panel-heading">
                <h1 id="register-title">Đăng ký</h1>
                <p>Tạo tài khoản để đặt vé nhanh chóng và nhận nhiều ưu đãi đặc biệt từ RexCinemas.</p>
            </div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" class="auth-form auth-register-form" data-auth-form>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="auth-field">
                    <label for="fullName">Họ và tên <span>*</span></label>
                    <input id="fullName" class="form-control" th:field="*{fullName}" autocomplete="name" maxlength="120" placeholder="Họ và tên" required>
                    <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
                </div>
                <div class="auth-field">
                    <label for="birthDate">Ngày sinh <span>*</span></label>
                    <input id="birthDate" class="form-control" type="date" th:field="*{birthDate}" autocomplete="bday" required>
                    <small class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></small>
                </div>
                <div class="auth-field">
                    <label for="phone">Số điện thoại <span>*</span></label>
                    <input id="phone" class="form-control" type="tel" th:field="*{phone}" inputmode="numeric" pattern="0[0-9]{9}" maxlength="10" autocomplete="tel" placeholder="Số điện thoại" required>
                    <small class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
                </div>
                <div class="auth-field">
                    <label for="username">Tên đăng nhập <span>*</span></label>
                    <input id="username" class="form-control" th:field="*{username}" minlength="4" maxlength="30" pattern="[A-Za-z0-9._]{4,30}" autocomplete="username" placeholder="Tên đăng nhập" required>
                    <small class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
                </div>
                <div class="auth-field">
                    <label for="nationalId">CCCD/CMND <span>*</span></label>
                    <input id="nationalId" class="form-control" th:field="*{nationalId}" inputmode="numeric" pattern="([0-9]{9}|[0-9]{12})" maxlength="12" placeholder="Số CCCD/CMND" required>
                    <small class="field-error" th:if="${#fields.hasErrors('nationalId')}" th:errors="*{nationalId}"></small>
                </div>
                <div class="auth-field">
                    <label for="email">Email <span>*</span></label>
                    <input id="email" class="form-control" type="email" th:field="*{email}" maxlength="150" autocomplete="email" placeholder="Địa chỉ email" required>
                    <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>
                <div class="auth-field">
                    <label for="favoriteCinemaId">Rạp yêu thích <span>*</span></label>
                    <select id="favoriteCinemaId" class="form-select" th:field="*{favoriteCinemaId}" required>
                        <option value="">Chọn rạp</option>
                        <option th:each="cinema : ${cinemas}" th:value="${cinema.id}" th:text="${cinema.name + ' — ' + cinema.city}"></option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('favoriteCinemaId')}" th:errors="*{favoriteCinemaId}"></small>
                </div>
                <div class="auth-field">
                    <label for="password">Mật khẩu <span>*</span></label>
                    <div class="password-control"><input id="password" class="form-control" type="password" name="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Mật khẩu" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button></div>
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Xác thực mật khẩu <span>*</span></label>
                    <div class="password-control"><input id="confirmPassword" class="form-control" type="password" name="confirmPassword" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Xác thực mật khẩu" required data-confirm-password="password"><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button></div>
                </div>
                <label class="auth-consent">
                    <input class="form-check-input" type="checkbox" th:field="*{termsAccepted}" required>
                    <span>Khách hàng đã đồng ý các điều khoản, điều kiện của thành viên RexCinemas và <a href="#privacy-policy">Chính sách bảo mật</a></span>
                </label>
                <small class="field-error" th:if="${#fields.hasErrors('termsAccepted')}" th:errors="*{termsAccepted}"></small>
                <button class="btn auth-submit" type="submit" data-submit-label="ĐĂNG KÝ">ĐĂNG KÝ</button>
            </form>
            <p class="auth-switch">Bạn đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a></p>
        </div>
    </section>
</main>
<script th:src="@{/js/auth-form.js}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
