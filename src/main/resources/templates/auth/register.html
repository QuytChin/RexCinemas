<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng ký tài khoản - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .auth-gender-wrap {
            display: flex;
            gap: 28px;
            align-items: center;
            min-height: 38px;
        }
        .auth-gender-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin: 0;
            color: #eef3fb;
            font-size: 0.88rem;
        }
        .auth-gender-option input[type="radio"] {
            width: 17px;
            height: 17px;
            accent-color: #ffe500;
            cursor: pointer;
        }
        .otp-input-large {
            letter-spacing: 8px;
            font-size: 1.6rem !important;
            font-weight: 800;
            text-align: center;
            font-family: monospace, 'Courier New', Courier;
            color: #ffe500 !important;
            background: #091322 !important;
            border: 2px dashed rgba(255, 229, 0, 0.5) !important;
        }
        .otp-input-large:focus {
            border-color: #ffe500 !important;
            box-shadow: 0 0 12px rgba(255, 229, 0, 0.25) !important;
        }
    </style>
</head>
<body class="auth-page auth-register-page">
<div th:replace="~{fragments/header :: header}"></div>
<main class="auth-layout">
    <section class="auth-panel-wrap" aria-labelledby="register-title">
        <div class="auth-panel auth-panel-register">
            <nav class="auth-tabs" aria-label="Tài khoản">
                <a class="auth-tab" th:href="@{/auth/login}">ĐĂNG NHẬP</a>
                <a class="auth-tab is-active" aria-current="page" th:href="@{/auth/register}">ĐĂNG KÝ</a>
            </nav>

            <div class="auth-panel-heading text-center mb-3">
                <h1 id="register-title">Đăng Ký Tài Khoản</h1>
                <p id="register-subtitle">Đăng ký thành viên Rex Cinemas để tận hưởng nhiều ưu đãi hấp dẫn.</p>
            </div>

            <!-- In-page alert thông báo lỗi / thành công -->
            <div id="inPageAlert" class="alert alert-danger d-none" role="alert"></div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

            <!-- BƯỚC 1: Form điền thông tin -->
            <div id="step-register">
                <form id="registerForm" th:action="@{/auth/register}" th:object="${registerForm}" method="post" class="auth-form auth-register-form">
                    <input type="hidden" th:if="${_csrf != null}" id="csrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="auth-field">
                        <label for="fullName">Họ và tên <span>*</span></label>
                        <input id="fullName" name="fullName" class="form-control" autocomplete="name" maxlength="120" placeholder="Nhập họ và tên" required>
                    </div>

                    <div class="auth-field">
                        <label for="email">Email <span>*</span></label>
                        <input id="email" name="email" class="form-control" type="email" maxlength="150" autocomplete="email" placeholder="Nhập Email" required>
                    </div>

                    <div class="auth-field">
                        <label for="phone">Số điện thoại <span>*</span></label>
                        <input id="phone" name="phone" class="form-control" type="tel" inputmode="numeric" pattern="0[0-9]{9}" maxlength="10" autocomplete="tel" placeholder="Nhập Số điện thoại" required>
                    </div>

                    <div class="auth-field">
                        <label>Giới tính <span>*</span></label>
                        <div class="auth-gender-wrap">
                            <label class="auth-gender-option">
                                <input type="radio" name="gender" value="Nam" checked>
                                <span>Nam</span>
                            </label>
                            <label class="auth-gender-option">
                                <input type="radio" name="gender" value="Nữ">
                                <span>Nữ</span>
                            </label>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="birthDate">Ngày sinh <span>*</span></label>
                        <input id="birthDate" name="birthDate" class="form-control" type="date" autocomplete="bday" required>
                    </div>

                    <div class="auth-field">
                        <label for="password">Mật khẩu <span>*</span></label>
                        <div class="password-control">
                            <input id="password" name="password" class="form-control" type="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Nhập Mật khẩu" required>
                            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="confirmPassword">Nhập lại mật khẩu <span>*</span></label>
                        <div class="password-control">
                            <input id="confirmPassword" name="confirmPassword" class="form-control" type="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required data-confirm-password="password">
                            <button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button>
                        </div>
                    </div>

                    <label class="auth-consent">
                        <input class="form-check-input" type="checkbox" id="termsAccepted" name="termsAccepted" required>
                        <span>Bằng việc đăng ký tài khoản, tôi đồng ý với <a href="/policies#terms">Điều khoản dịch vụ</a> và <a href="/policies#privacy">Chính sách bảo mật</a> của Rex Cinemas.</span>
                    </label>

                    <button id="btnSubmitRegister" class="btn auth-submit w-100" type="submit">HOÀN THÀNH</button>
                </form>
            </div>

            <!-- BƯỚC 2: Nhập mã xác thực OTP gửi về Gmail -->
            <div id="step-otp" class="d-none">
                <div class="text-center mb-3">
                    <div style="font-size: 2.4rem; margin-bottom: 8px;">📩</div>
                    <h2 class="h5 text-white mb-2">Xác thực mã OTP</h2>
                    <p class="small text-muted mb-0">
                        Mã xác thực 6 chữ số đã được gửi tới email <br>
                        <strong id="displayEmail" class="text-warning"></strong>.
                    </p>
                </div>

                <form id="otpForm" class="auth-form">
                    <div class="auth-field">
                        <label for="otpInput" class="text-center d-block">Nhập mã OTP <span>*</span></label>
                        <input id="otpInput" type="text" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" class="form-control otp-input-large" placeholder="••••••" autocomplete="one-time-code" required>
                        <small class="text-muted text-center d-block mt-2">Mã OTP có hiệu lực trong vòng 5 phút</small>
                    </div>

                    <button id="btnVerifyOtp" class="btn auth-submit w-100" type="submit">XÁC NHẬN & ĐĂNG KÝ</button>

                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary border-opacity-25">
                        <button type="button" id="btnBackToForm" class="btn btn-link text-decoration-none text-light p-0 small">
                            ← Sửa thông tin
                        </button>
                        <button type="button" id="btnResendOtp" class="btn btn-link text-decoration-none text-warning p-0 small" disabled>
                            Gửi lại mã (<span id="resendCountdown">60</span>s)
                        </button>
                    </div>
                </form>
            </div>

            <p class="auth-switch">Bạn đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a></p>
        </div>
    </section>
</main>
<script th:src="@{/js/auth-form.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
