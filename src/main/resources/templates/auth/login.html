<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-bg">
<div class="auth-card">
    <a th:href="@{/}" class="brand-big">R</a>
    <h2>Chào mừng trở lại</h2>
    <p class="text-secondary">Đăng nhập để chọn suất chiếu, giữ ghế và quản lý vé điện tử.</p>
    <div class="alert alert-info" th:if="${returnUrl != null and #strings.startsWith(returnUrl,'/booking/')}">
        Đăng nhập xong hệ thống sẽ đưa bạn trở lại đúng suất chiếu vừa chọn.
    </div>
    <div class="alert alert-success" th:if="${param.registered}">Đăng ký thành công. Hãy đăng nhập.</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/auth/login}" method="post" class="d-grid gap-3">
        <input type="hidden" name="returnUrl" th:value="${returnUrl}">
        <div><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
        <div><label class="form-label">Mật khẩu</label><input class="form-control" type="password" name="password" required></div>
        <button class="btn btn-danger btn-lg">Đăng nhập</button>
    </form>
    <p class="mt-4 mb-0">Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký</a></p>
    <div class="demo-box mt-4"><small>Demo: user@rexchain.vn / 123456<br>Admin: admin@rexchain.vn / admin123</small></div>
</div>
</body>
</html>
