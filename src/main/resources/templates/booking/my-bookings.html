<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vé của tôi</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container pt-page pb-5">
    <p class="eyebrow">VÉ CỦA TÔI</p><h1 class="fw-bold mb-2">Vé điện tử của tôi</h1><p class="text-secondary mb-4">Mở vé để hiển thị mã QR và xác nhận vé tại rạp.</p>
    <div class="row g-3">
        <div class="col-lg-6" th:each="b:${bookings}">
            <a class="ticket-list text-decoration-none ticket-list-v2" th:href="@{'/bookings/'+${b.id}}">
                <div><span class="badge text-bg-danger" th:text="${b.bookingCode}"></span><h5 class="mt-2" th:text="${b.showtime.movie.title}"></h5><p class="mb-1 text-secondary" th:text="${b.showtime.auditorium.cinema.name+' • '+#temporals.format(b.showtime.startTime,'HH:mm dd/MM/yyyy')}"></p><small>Ghế: <span th:each="s,i:${b.seats}" th:text="${s.seatLabel+(i.last?'':', ')}"></span></small></div>
                <div class="text-end"><span class="badge mb-2" th:classappend="${b.status.name()=='CONFIRMED'?' text-bg-success':(b.status.name()=='PENDING'?' text-bg-warning':' text-bg-secondary')}" th:text="${@uiText.label(b.status)}"></span><br><span class="badge text-bg-info mb-2" th:if="${b.checkedIn}">ĐÃ CHECK-IN</span><br th:if="${b.checkedIn}"><strong th:text="${#numbers.formatDecimal(b.totalAmount,0,'COMMA',0,'POINT')+'đ'}"></strong><div class="small text-warning mt-2" th:if="${b.status.name()=='CONFIRMED' and !b.checkedIn}">Mở mã QR →</div></div>
            </a>
        </div>
    </div>
    <div th:if="${bookings.isEmpty()}" class="empty-state">Bạn chưa có vé nào.</div>
    <nav class="d-flex justify-content-between align-items-center mt-4" th:if="${bookingPage.totalPages > 1}" aria-label="Phân trang lịch sử vé">
        <a class="btn btn-outline-light" th:if="${bookingPage.hasPrevious()}" th:href="@{/bookings(page=${bookingPage.number - 1})}">Trang trước</a>
        <span class="text-secondary" th:text="|Trang ${bookingPage.number + 1} / ${bookingPage.totalPages}|">Trang 1 / 1</span>
        <a class="btn btn-outline-light" th:if="${bookingPage.hasNext()}" th:href="@{/bookings(page=${bookingPage.number + 1})}">Trang sau</a>
    </nav>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
