<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lịch chiếu - Rex Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-xl pt-page pb-5">
    <div class="schedule-hero">
        <p class="eyebrow">SHOWTIMES & BOOKING</p>
        <h1>LỊCH CHIẾU</h1>
        <p>Chọn ngày, rạp hoặc phim. Suất còn ghế có thể đặt vé trực tiếp ngay tại đây.</p>
    </div>

    <div class="date-tabs" role="tablist" aria-label="Chọn ngày chiếu">
        <a th:each="d:${dates}" th:href="@{/schedule(cinemaId=${selectedCinemaId},movieId=${selectedMovieId},date=${d})}"
           th:classappend="${d.equals(selectedDate) ? ' active' : ''}"
           th:aria-current="${d.equals(selectedDate) ? 'date' : null}">
            <strong th:text="${#temporals.format(d,'dd/MM')}"></strong>
            <small th:switch="${d.dayOfWeek.name()}">
                <span th:case="'MONDAY'">Thứ Hai</span>
                <span th:case="'TUESDAY'">Thứ Ba</span>
                <span th:case="'WEDNESDAY'">Thứ Tư</span>
                <span th:case="'THURSDAY'">Thứ Năm</span>
                <span th:case="'FRIDAY'">Thứ Sáu</span>
                <span th:case="'SATURDAY'">Thứ Bảy</span>
                <span th:case="'SUNDAY'">Chủ Nhật</span>
            </small>
        </a>
    </div>

    <form th:action="@{/schedule}" method="get" class="schedule-filter">
        <div><label>Rạp</label><select class="form-select" name="cinemaId"><option value="">Tất cả rạp</option><option th:each="c:${cinemas}" th:value="${c.id}" th:text="${c.name+' — '+c.city}" th:selected="${selectedCinemaId!=null and selectedCinemaId==c.id}"></option></select></div>
        <div><label>Phim</label><select class="form-select" name="movieId"><option value="">Tất cả phim</option><option th:each="m:${movies}" th:value="${m.id}" th:text="${m.title}" th:selected="${selectedMovieId!=null and selectedMovieId==m.id}"></option></select></div>
        <div><label>Ngày</label><input type="date" class="form-control" name="date" th:value="${selectedDate}"></div>
        <button class="btn btn-rex">ÁP DỤNG</button>
    </form>

    <section class="movie-schedule-block" th:each="entry : ${schedule}"
             th:if="${entry != null and entry.key != null}">
        <div class="movie-show-row">
            <div class="movie-show-poster">
                <img th:src="${@cinemaArtwork.imageUrl(entry.key.posterUrl, 'movie')}"
                     data-image-fallback="movie"
                     th:alt="${(entry.key.title != null ? entry.key.title : 'Phim RexCinemas') + ' poster'}">
            </div>
            <div class="movie-show-info w-100">
                <div class="movie-show-heading">
                    <div>
                        <h3>
                            <a th:if="${entry.key.id != null}" th:href="@{'/movies/'+${entry.key.id}}"
                               th:text="${entry.key.title != null ? entry.key.title : 'Phim chưa cập nhật'}"></a>
                            <span th:unless="${entry.key.id != null}"
                                  th:text="${entry.key.title != null ? entry.key.title : 'Phim chưa cập nhật'}"></span>
                        </h3>
                        <p class="movie-show-metadata">
                            <span th:if="${entry.key.genre != null and !#strings.isEmpty(entry.key.genre)}" th:text="${entry.key.genre}"></span>
                            <span th:if="${entry.key.durationMinutes > 0}" th:text="${entry.key.durationMinutes+' phút'}"></span>
                            <span th:if="${entry.key.language != null and !#strings.isEmpty(entry.key.language)}" th:text="${entry.key.language}"></span>
                            <span th:if="${entry.key.ageRating != null}" th:text="${entry.key.ageRating}"></span>
                        </p>
                    </div>
                    <a class="btn btn-sm btn-outline-light" th:if="${entry.key.id != null}"
                       th:href="@{'/movies/'+${entry.key.id}}">Chi tiết phim</a>
                </div>
                <div class="cinema-showtime-group" th:each="cinemaEntry : ${entry.value}"
                     th:if="${cinemaEntry != null and cinemaEntry.key != null}">
                    <div class="cinema-showtime-label">
                        <strong th:text="${cinemaEntry.key.name != null ? cinemaEntry.key.name : 'Rạp RexCinemas'}"></strong>
                        <span th:if="${cinemaEntry.key.address != null and !#strings.isEmpty(cinemaEntry.key.address)}"
                              th:text="${cinemaEntry.key.address}"></span>
                    </div>
                    <div class="showtime-chip-list">
                        <th:block th:each="s : ${cinemaEntry.value}" th:if="${s != null and s.id != null and s.startTime != null and s.auditorium != null}">
                            <th:block th:replace="~{fragments/showtime-selection :: timeChip(${s}, ${availableSeats != null ? availableSeats[s.id] : null})}"></th:block>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="schedule-empty-state" th:if="${schedule == null or schedule.isEmpty()}">
        <span class="schedule-empty-icon" aria-hidden="true">◷</span>
        <h2>Hiện chưa có lịch chiếu cho ngày này.</h2>
        <p>Hãy thử chọn ngày khác hoặc điều chỉnh bộ lọc rạp/phim.</p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
