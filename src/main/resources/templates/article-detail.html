<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${article.title}+' - Rex Cinemas'"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="container-xl pt-page pb-5"><article class="article-detail"><div class="article-detail-head"><span th:text="${article.category}"></span><h1 th:text="${article.title}"></h1><p th:text="${article.summary}"></p><small th:if="${article.publishDate!=null}" th:text="${#temporals.format(article.publishDate,'dd/MM/yyyy')}"></small></div><img class="article-cover" th:if="${article.imageUrl!=null}" th:src="${article.imageUrl}" th:alt="${article.title}"><div class="article-content" th:text="${article.content}"></div><a class="btn btn-outline-light" th:if="${article.linkUrl!=null and !#strings.isEmpty(article.linkUrl)}" th:href="${article.linkUrl}" target="_blank">Xem nguồn liên quan</a></article><section class="mt-5"><div class="section-heading"><div><p class="eyebrow">MORE STORIES</p><h2>BÀI VIẾT KHÁC</h2></div></div><div class="article-grid"><article class="article-card" th:each="a:${latestArticles}"><a th:href="@{'/articles/'+${a.id}}"><img th:src="${a.imageUrl}" alt=""></a><div><span th:text="${a.category}"></span><h3><a th:href="@{'/articles/'+${a.id}}" th:text="${a.title}"></a></h3></div></article></div></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
