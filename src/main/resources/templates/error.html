<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rex Cinemas - Có lỗi</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container pt-page pb-5">
    <section class="empty-state error-panel mx-auto" role="alert">
        <p class="eyebrow">REX CINEMAS</p>
        <h1 th:text="${status != null ? status : 'Oops'}">400</h1>
        <h2>Có điều gì đó chưa đúng</h2>
        <p class="text-secondary" th:text="${message != null ? message : 'Không thể xử lý yêu cầu này.'}">
            Không thể xử lý yêu cầu này.
        </p>
        <small class="text-secondary" th:if="${path != null}" th:text="${path}"></small>
        <div class="mt-4 d-flex gap-2 justify-content-center">
            <a class="btn btn-rex" th:href="@{/}">VỀ TRANG CHỦ</a>
            <a class="btn btn-outline-light" href="javascript:history.back()">QUAY LẠI</a>
        </div>
    </section>
</main>
</body>
</html>
