<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo | RexCinemas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><main class="container pt-page pb-5"><section class="profile-card notification-page"><p class="eyebrow">MY REX</p><h1>Thông báo</h1><div class="notification-list notification-page-list" th:if="${!notifications.empty}"><a th:each="notification : ${notifications.content}" class="notification-item" th:classappend="${!notification.read ? ' is-unread' : ''}" th:href="${notification.link}" th:attr="data-notification-id=${notification.id}"><strong th:text="${notification.title}">Thông báo</strong><span th:text="${notification.message}">Nội dung</span><small th:text="${#temporals.format(notification.createdAt, 'HH:mm · dd/MM/yyyy')}"></small></a></div><p class="header-popover-empty" th:if="${notifications.empty}">Bạn chưa có thông báo.</p><nav class="notification-pagination" th:if="${notifications.totalPages > 1}"><a class="btn btn-outline-light" th:if="${notifications.hasPrevious()}" th:href="@{/notifications(page=${notifications.number - 1})}">Trang trước</a><span th:text="${'Trang ' + (notifications.number + 1) + ' / ' + notifications.totalPages}"></span><a class="btn btn-outline-light" th:if="${notifications.hasNext()}" th:href="@{/notifications(page=${notifications.number + 1})}">Trang sau</a></nav></section></main><div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
