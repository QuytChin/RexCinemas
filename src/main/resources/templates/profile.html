<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rex Member</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div>
<main class="container-xl pt-page pb-5"><div class="profile-grid-v3"><aside class="member-panel"><div class="avatar-wrap"><img th:if="${user.avatarUrl!=null and !#strings.isEmpty(user.avatarUrl)}" th:src="${user.avatarUrl}" alt="avatar"><div th:unless="${user.avatarUrl!=null and !#strings.isEmpty(user.avatarUrl)}" class="avatar-fallback" th:text="${#strings.substring(user.fullName,0,1)}"></div></div><h3 th:text="${user.fullName}"></h3><p th:text="${user.email}"></p><div class="member-tier" th:classappend="${' tier-'+#strings.toLowerCase(user.membershipTier.name())}"><small>REX MEMBER</small><strong th:text="${user.membershipTier}"></strong><span th:text="${user.loyaltyPoints+' điểm khả dụng'}"></span></div><div class="tier-progress"><div class="d-flex justify-content-between"><span>Tiến độ hạng</span><strong th:text="${user.lifetimePoints+' / '+user.nextTierTarget}"></strong></div><div class="progress"><div class="progress-bar" th:style="|width:${user.tierProgressPercent}%;|"></div></div><small th:if="${user.tierProgressPercent<100}">Tích thêm điểm để mở hạng tiếp theo.</small><small th:if="${user.tierProgressPercent==100}">Bạn đã đạt hạng cao nhất.</small></div><div class="profile-links"><a th:href="@{/bookings}">🎟 Lịch sử đặt vé</a><a th:href="@{/schedule}">🗓 Lịch chiếu</a><a th:href="@{/}">← Về trang chủ</a></div></aside>
<section class="profile-main-v3"><div class="profile-heading"><div><p class="eyebrow">MY REX</p><h1>Hồ sơ thành viên</h1></div><div class="points-box"><span>Tổng điểm tích lũy</span><strong th:text="${user.lifetimePoints}"></strong></div></div><div class="alert alert-success" th:if="${param.success}">Cập nhật hồ sơ thành công.</div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/profile}" method="post" enctype="multipart/form-data" class="profile-form-v3"><div class="row g-3"><div class="col-md-6"><label class="form-label">Họ và tên</label><input class="form-control" name="fullName" th:value="${user.fullName}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" th:value="${user.email}" disabled></div><div class="col-md-6"><label class="form-label">Số điện thoại</label><input class="form-control" name="phone" th:value="${user.phone}"></div><div class="col-md-6"><label class="form-label">Ảnh đại diện Cloudinary</label><input type="file" class="form-control" name="avatarFile" accept="image/*"></div><div class="col-12"><label class="form-label">Địa chỉ</label><input class="form-control" name="address" th:value="${user.address}"></div><div class="col-12"><div class="form-divider"><span>BẢO MẬT</span></div></div><div class="col-12"><label class="form-label">Đổi mật khẩu <span class="text-secondary">(để trống nếu không đổi)</span></label><input type="password" class="form-control" name="newPassword" minlength="6" placeholder="Tối thiểu 6 ký tự"></div><div class="col-12"><button class="btn btn-rex px-4">LƯU THAY ĐỔI</button></div></div></form></section></div></main>
<div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
