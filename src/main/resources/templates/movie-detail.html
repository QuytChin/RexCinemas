<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${movie.title}+' - Rex Cinemas'"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/header :: header}"></div>
<section class="movie-detail-hero"><div class="movie-detail-bg" th:style="|background-image:linear-gradient(90deg,rgba(5,6,10,.97),rgba(5,6,10,.78) 55%,rgba(5,6,10,.45)),url('${movie.posterUrl}');|"></div><div class="container-xl movie-detail-inner"><img th:src="${movie.posterUrl}" class="detail-poster" alt="poster"><div><p class="eyebrow">MOVIE DETAIL</p><h1 th:text="${movie.title}"></h1><div class="rating-summary"><strong th:text="${#numbers.formatDecimal(averageRating,1,1)}+' / 5'"></strong><span class="stars">★★★★★</span><span th:text="${reviewCount}+' đánh giá'"></span></div><div class="movie-meta-chips"><span th:text="${movie.ageRating}"></span><span th:text="${movie.durationMinutes}+' phút'"></span><span th:text="${movie.genre}"></span><span th:text="${movie.language}"></span></div><p class="movie-detail-desc" th:text="${movie.description}"></p><div class="d-flex gap-2 flex-wrap"><a class="btn btn-rex btn-lg" href="#showtimes">CHỌN SUẤT CHIẾU</a><a class="btn btn-outline-light btn-lg" th:if="${movie.trailerUrl!=null and !#strings.isEmpty(movie.trailerUrl)}" th:href="${movie.trailerUrl}" target="_blank">▶ XEM TRAILER</a></div></div></div></section>
<main class="container-xl pb-5"><section id="showtimes" class="detail-section"><div class="section-heading"><div><p class="eyebrow">BOOK NOW</p><h2>LỊCH CHIẾU</h2></div></div><div class="cinema-showtimes" th:each="entry:${showtimesByCinema}"><div class="cinema-mini-head"><div><h3 th:text="${entry.key.name}"></h3><p th:text="${entry.key.address}"></p></div><span th:text="${entry.key.city}"></span></div><div class="showtime-booking-grid"><div class="showtime-book-card" th:each="s:${entry.value}" th:classappend="${availableSeats[s.id] == 0 ? ' sold-out' : ''}"><div class="showtime-book-main"><strong th:text="${#temporals.format(s.startTime,'HH:mm')}"></strong><span th:text="${#temporals.format(s.startTime,'dd/MM')+' • '+s.auditorium.name}"></span></div><div class="showtime-book-meta"><span th:text="${#numbers.formatDecimal(s.basePrice,0,'COMMA',0,'POINT')+'đ'}"></span><small th:if="${availableSeats[s.id] > 0}" th:text="${'Còn '+availableSeats[s.id]+'/'+totalSeats[s.id]+' ghế'}"></small><small class="text-danger" th:if="${availableSeats[s.id] == 0}">Hết ghế</small></div><a sec:authorize="isAuthenticated()" th:if="${availableSeats[s.id] > 0}" class="btn btn-rex btn-sm" th:href="@{'/booking/'+${s.id}}">ĐẶT VÉ</a><a sec:authorize="!isAuthenticated()" th:if="${availableSeats[s.id] > 0}" class="btn btn-rex btn-sm" th:href="@{/auth/login(returnUrl=${'/booking/'+s.id})}">ĐĂNG NHẬP & ĐẶT</a><button th:if="${availableSeats[s.id] == 0}" class="btn btn-outline-secondary btn-sm" disabled>HẾT GHẾ</button></div></div></div><div class="empty-panel" th:if="${showtimesByCinema.isEmpty()}">Phim chưa có suất chiếu sắp tới.</div></section>
<section class="review-section"><div class="row g-4"><div class="col-lg-5"><div class="review-form-card" sec:authorize="isAuthenticated()"><p class="eyebrow">YOUR REVIEW</p><h3 th:text="${myReview!=null?'Cập nhật đánh giá':'Đánh giá phim'}"></h3><form th:action="@{'/movies/'+${movie.id}+'/reviews'}" method="post"><label class="form-label">Điểm</label><select name="rating" class="form-select mb-3"><option th:each="n:${#numbers.sequence(5,1)}" th:value="${n}" th:text="${n}+' sao'" th:selected="${myReview!=null and myReview.rating==n}"></option></select><label class="form-label">Nhận xét</label><textarea name="comment" class="form-control mb-3" rows="5" maxlength="1200" required th:text="${myReview!=null?myReview.comment:''}"></textarea><button class="btn btn-rex">GỬI ĐÁNH GIÁ</button></form></div><div class="review-form-card" sec:authorize="!isAuthenticated()"><h4>Muốn đánh giá phim?</h4><p class="text-secondary">Đăng nhập để chấm điểm và chia sẻ cảm nhận.</p><a class="btn btn-outline-light" th:href="@{/auth/login}">Đăng nhập</a></div></div><div class="col-lg-7"><div class="d-flex justify-content-between align-items-center mb-3"><h3>Nhận xét từ khán giả</h3><span class="text-secondary" th:text="${reviewCount}+' bài'"></span></div><div class="d-grid gap-3"><article class="review-card" th:each="r:${reviews}"><div class="d-flex justify-content-between gap-3"><div><strong th:text="${r.user.fullName}"></strong><div class="stars small"><span th:each="n:${#numbers.sequence(1,5)}" th:text="${n<=r.rating?'★':'☆'}"></span></div></div><small class="text-secondary" th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></small></div><p class="mb-0 mt-3" th:text="${r.comment}"></p></article><div class="empty-panel" th:if="${reviews.isEmpty()}">Chưa có đánh giá nào.</div></div></div></div></section></main>
<div th:replace="~{fragments/footer :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
