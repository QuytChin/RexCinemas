name: RexCinemas CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify no secret files are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.dpapi$|.*\.p12$|.*\.jks$)' | grep -v -E '(^|/)\.env\.example$'; then
            echo 'A local secret or key file is tracked.' >&2
            exit 1
          fi
          if git grep -n -I -E '(^|[[:space:]])(DB_PASSWORD|JWT_SECRET|MAIL_PASSWORD|CLOUDINARY_API_SECRET|SEPAY_API_KEY)=(.{8,})' -- ':!*.md' ':!.env.example' ':!start-rex-prefilled.ps1'; then
            echo 'A runtime credential appears hardcoded in tracked source.' >&2
            exit 1
          fi

      - name: Compile
        run: mvn -B -ntp -DskipTests compile

      - name: Run isolated test suite
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_PASSWORD: ''
          JWT_SECRET: ci-only-test-secret-that-is-long-enough-1234567890
          MAIL_PASSWORD: ''
        run: mvn -B -ntp test
